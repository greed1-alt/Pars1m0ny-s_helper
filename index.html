<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Напоминалка">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Напоминалка</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#15171a;--mut:#6b7280;--line:#dfe2e6;--acc:#1f2430;--accfg:#fff;--dng:#b42318}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08090c;--card:#12151d;--tx:#eef0f3;--mut:#8b93a3;--line:#232733;--acc:#e08a3c;--accfg:#1a0f02;--dng:#f87171}}
:root[data-theme=dark]{--bg:#08090c;--card:#12151d;--tx:#eef0f3;--mut:#8b93a3;--line:#232733;--acc:#e08a3c;--accfg:#1a0f02;--dng:#f87171}
:root[data-theme=black]{--bg:#000000;--card:#141414;--tx:#f2f2f2;--mut:#9a9a9a;--line:#272727;--acc:#e6e6e6;--accfg:#111111;--dng:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:block}
.content{padding-bottom:96px}
#side{display:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px}
h1{flex:1;margin:0;font-size:21px;font-weight:700;text-align:center;letter-spacing:-.01em}
.ic{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:18px;line-height:1}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:9px;background:transparent;font-size:14px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
main{padding:12px 14px;max-width:960px;margin:0 auto}
main.full{max-width:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dw{font-style:normal;text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cell{aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:15px}
.cell.oth{opacity:.4}
.cell.today span{background:var(--acc);color:var(--accfg);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:700}
.cell.sel{outline:2px solid var(--acc);outline-offset:-1px}
.cell em{display:flex;gap:2px;min-height:7px}
.cell u{width:6px;height:6px;border-radius:50%}
.chipsline{display:none}
.chipline{display:block;width:100%;padding:3px 7px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;background:color-mix(in srgb, var(--card) 78%, var(--c) 26%);color:var(--c)}
.chipline.more{background:none!important;color:var(--mut);font-weight:500;padding-left:7px}
.wgwrap{overflow:auto;max-height:68vh}
.wg-stickytop{position:sticky;top:0;z-index:3;background:var(--bg)}
.wg-head,.wg-alldays{display:grid;grid-template-columns:56px repeat(7,minmax(130px,1fr))}
.wg-corner{border-bottom:1px solid var(--line)}
.wg-day{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.wg-day.wknd{background:color-mix(in srgb, var(--bg) 88%, var(--tx) 12%)}
.wg-dow{display:block;font-size:11px;color:var(--mut)}
.wg-num{margin-top:2px;width:28px;height:28px;border-radius:50%;border:0;background:none;color:var(--tx);font-size:15px;font-weight:600}
.wg-num.today{background:var(--acc);color:var(--accfg)}
.wg-num.sel:not(.today){outline:1px solid var(--acc);outline-offset:-1px}
.wg-alldays{min-height:34px}
.wg-allcol{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px}
.wg-chip{text-align:left;border:0;border-radius:6px;padding:3px 7px;font-size:11.5px;font-weight:600;background:color-mix(in srgb, var(--card) 78%, var(--c) 26%);color:var(--c)}
.wg-add{border:1px dashed var(--line);background:none;color:var(--mut);border-radius:6px;font-size:13px;padding:2px 0}
.wg-body{display:flex}
.wg-hours{width:56px;flex:none;position:relative}
.wg-nowlabel{position:absolute;right:6px;transform:translateY(-50%);color:#e5484d;font-weight:700;font-size:11px;background:var(--bg);padding-left:4px}
.wg-hourrow{height:56px;font-size:10.5px;color:var(--mut);padding-right:7px;text-align:right;box-sizing:border-box;transform:translateY(-6px)}
.wg-cols{position:relative;display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));flex:1}
.wg-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(180deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 56px)}
.wg-col.wknd{background-color:color-mix(in srgb, var(--bg) 88%, var(--tx) 12%)}
.wg-block{position:absolute;left:3px;right:3px;height:50px;border:0;border-left:3px solid var(--c);border-radius:6px;padding:3px 7px;font-size:11.5px;text-align:left;background:color-mix(in srgb, var(--card) 74%, var(--c) 30%);color:var(--c);font-weight:600;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.wg-block b{font-weight:700}
.wg-block.done{opacity:.5;text-decoration:line-through}
.wg-now{position:absolute;left:0;right:0;height:0;border-top:2px solid #e5484d;z-index:2}
.wg-now::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#e5484d}
@media(min-width:900px){
  .seg-month{display:none}
  .wg-head,.wg-alldays{grid-template-columns:60px repeat(7,1fr)}
  .wg-cols{grid-template-columns:repeat(7,1fr)}
  .wg-hours,.wg-corner{width:60px}
  .wgwrap{max-height:78vh;overflow-x:hidden}
}
.panel,.wd{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.ph,.wh{font-size:15px;margin-bottom:8px}
.wd.today{border-color:var(--acc)}
.wh{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font-weight:600}
.ev{display:flex;align-items:stretch;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.bar{width:5px;border-radius:3px;flex:none}
.chk{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;background:none;flex:none;align-self:center;font-size:15px;padding:0}
.done .chk{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.evb{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.evb b{display:block;font-weight:600}
.evb small{color:var(--mut)}
.evb p{margin:4px 0 0;font-size:14px;color:var(--mut);white-space:pre-wrap}
.done .evb b{text-decoration:line-through;opacity:.55}
.empty{color:var(--mut);font-size:14px;margin:0}
#fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:18px;background:var(--acc);color:var(--accfg);font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.show{display:flex}
#sh{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#sh h3{margin:0 0 14px}
#f_t{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 0 10px;font-size:19px;font-weight:600;margin-bottom:14px}
#f_t:focus{outline:0;border-color:var(--acc)}
#sh select,#sh textarea,#sh input[type=date],#sh input[type=time]{width:100%;padding:11px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#sh textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:flex-start}
.row>*{flex:1;margin-bottom:10px}
.btn{padding:11px;border:1px solid var(--line);border-radius:10px;background:transparent}
.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.dng{color:var(--dng)}
.cr input[type=color]{flex:none;width:44px;padding:2px;height:44px}
.cr .btn{flex:none;width:44px;padding:0;height:44px;margin-bottom:10px}
#plog{font-size:13px;color:var(--mut);white-space:pre-wrap;margin:6px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 4px;font-weight:600}
.qc{position:fixed;z-index:25;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:14px;width:280px}
.qc.show{display:block}
.qc .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qc .qhead b{font-size:13px}
.qc .qx{border:0;background:none;color:var(--mut);font-size:18px;line-height:1;padding:2px 4px}
.qc input[type=text],.qc input[type=time],.qc select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px;box-sizing:border-box}
.qc .qrow{display:flex;gap:6px}
.qc .qrow>*{flex:1}
.qc .qbtns{display:flex;gap:6px;margin-top:2px}
.qc .qbtns .btn{flex:1;padding:8px;font-size:13px}
.chkrow{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:15px}
.chkrow input{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{padding:7px 11px;border:1px solid var(--line);border-radius:20px;background:var(--bg);font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
@media(min-width:900px){
  .app{display:flex;min-height:100vh}
  #side{display:block;width:250px;flex:none;border-right:1px solid var(--line);padding:20px 16px;background:var(--card)}
  .content{flex:1;min-width:0}
  main{padding:24px 28px}
  .sidehead{margin-bottom:16px}
  #mini .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  #mini .mgrid i{font-style:normal;text-align:center;font-size:10px;color:var(--mut)}
  #mini .mcell{aspect-ratio:1;border:0;background:none;border-radius:6px;font-size:12px;color:var(--tx);position:relative;padding:0}
  #mini .mcell.oth{opacity:.35}
  #mini .mcell.today{background:var(--acc);color:var(--accfg);font-weight:700}
  #mini .mcell.sel:not(.today){outline:1px solid var(--acc);outline-offset:-1px}
  #mini .mcell u{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--acc)}
  .sidecats{margin-top:18px}
  .catrow{display:flex;align-items:center;gap:8px;width:100%;padding:6px 2px;font-size:13px;background:none;border:0;text-align:left;border-radius:6px}
  .catrow:hover{background:var(--bg)}
  .catrow.off{opacity:.35}
  .catdot{width:10px;height:10px;border-radius:50%;flex:none}
  .grid{gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cell{aspect-ratio:auto;min-height:128px;align-items:flex-start;justify-content:flex-start;padding:9px;position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0}
  .cell span{align-self:flex-start}
  .cell.today span{width:26px;height:26px;border-radius:50%}
  .cell.sel{outline:1px solid var(--acc);outline-offset:-2px}
  .cell em.dots{display:none}
  .chipsline{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:6px;overflow:hidden}
  .dw{padding:8px 0;text-align:left;padding-left:8px}
  #ov{background:rgba(0,0,0,.15);align-items:stretch;justify-content:flex-end}
  #sh{width:380px;max-width:380px;height:100vh;max-height:100vh;border-radius:0;box-shadow:-10px 0 28px rgba(0,0,0,.18)}
}
@media(hover:hover){.cell:hover{outline:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <div class="content">
    <header>
      <div class="top"><button class="ic" data-act="prev">‹</button><h1 id="ttl"></h1><button class="ic" data-act="next">›</button><button class="ic" data-act="settings">⚙︎</button></div>
      <div class="seg"><button class="seg-month" data-act="v" data-v="month">Месяц</button><button data-act="v" data-v="week">Неделя</button><button data-act="v" data-v="day">День</button><button data-act="today">Сегодня</button></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<button id="fab" data-act="add" aria-label="Добавить событие">+</button>
<div id="ov"><div id="sh"></div></div>
<div id="qc" class="qc"></div>

<script>
const SUPABASE_URL = 'https://zgasnvubcdprgsypkglh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_D9zVovgo-2C3MBGolggC6w_SNb8fOzR';
const VAPID_PUBLIC = 'BNLThhEBoIT1sgFRviDsI33JdA_Rz18EY5SN7ANL8_gXdctCj4vYguPYopLrBMhAsfgIropWotPwypRexGUeZYU';

const $ = s => document.querySelector(s);
const LS = 'remapp_v1';
const DEF = { cats:[{id:'work',name:'Работа',color:'#ef4444'},{id:'rest',name:'Отдых',color:'#38bdf8'},{id:'walk',name:'Прогулка',color:'#22c55e'},{id:'study',name:'Учёба',color:'#a855f7'}], events:[], settings:{weekStart:1, theme:'auto'} };
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
S = Object.assign(structuredClone(DEF), S || {});
S.settings = Object.assign({}, DEF.settings, S.settings);
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
let hiddenCats = new Set();

const MON = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const dowName = s => DOW[(pd(s).getDay() + 6) % 7];
const fmtLong = s => { const d = pd(s); return d.getDate() + ' ' + MONG[d.getMonth()] + ', ' + dowName(s).toLowerCase(); };
const weekStartOf = s => { const d = pd(s); const off = S.settings.weekStart === 1 ? (d.getDay()+6)%7 : d.getDay(); d.setDate(d.getDate() - off); return ds(d); };
const cat = id => S.cats.find(c => c.id === id) || {name:'Без категории', color:'#94a3b8'};
const evOn = k => S.events.filter(e => e.date === k && !hiddenCats.has(e.cat)).sort((a,b) => (a.time||'00:00').localeCompare(b.time||'00:00'));
const timeRange = e => e.time ? (e.time2 ? esc(e.time) + '–' + esc(e.time2) : esc(e.time)) : '';
const remLabel = e => {
  if (!e.reminder || !e.reminder.enabled) return '';
  const off = Number(e.reminder.offset || 0);
  const when = off === 0 ? 'в момент события' : off < 60 ? `за ${off} мин` : off < 1440 ? `за ${off/60} ч` : `за ${off/1440} дн`;
  const rep = e.reminder.repeat === 'daily' ? ', каждый день' : e.reminder.repeat === 'custom' && (e.reminder.days||[]).length ? ', по: ' + e.reminder.days.map(d => DOW[d]).join(' ') : '';
  return ` · 🔔 ${when}${rep}`;
};

let view = (window.innerWidth >= 900 ? 'week' : 'month'), sel = ds(new Date()), monthAnchor = pd(sel);
monthAnchor.setDate(1);

function evHTML(e) {
  return `<div class="ev${e.done?' done':''}"><span class="bar" style="background:${cat(e.cat).color}"></span>
  <button class="chk" data-act="toggle" data-id="${e.id}" aria-label="Выполнено">${e.done?'✓':''}</button>
  <button class="evb" data-act="edit" data-id="${e.id}"><b>${esc(e.title)}</b><small>${e.time?timeRange(e)+' · ':''}${esc(cat(e.cat).name)}${remLabel(e)}</small>${e.note?`<p>${esc(e.note)}</p>`:''}</button></div>`;
}
const listHTML = k => { const es = evOn(k); return es.length ? es.map(evHTML).join('') : '<p class="empty">Событий нет</p>'; };

function gridCells(anchor, fn) {
  const d = new Date(anchor);
  const off = S.settings.weekStart === 1 ? (d.getDay()+6)%7 : d.getDay();
  const n = Math.ceil((off + new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()) / 7) * 7;
  let h = '';
  for (let i = 0; i < n; i++) { const c = new Date(d); c.setDate(1 - off + i); h += fn(c, c.getMonth() === d.getMonth()); }
  return h;
}
function monthHTML() {
  const today = ds(new Date());
  const dows = S.settings.weekStart === 1 ? DOW : [DOW[6], ...DOW.slice(0,6)];
  let h = '<div class="grid">' + dows.map(x => `<i class="dw">${x}</i>`).join('');
  h += gridCells(monthAnchor, (c, inMonth) => {
    const k = ds(c), es = evOn(k);
    const dots = es.slice(0,4).map(e => `<u style="background:${cat(e.cat).color}"></u>`).join('');
    const chips = es.slice(0,3).map(e => `<span class="chipline" style="--c:${cat(e.cat).color}">${esc(e.title)}</span>`).join('') + (es.length>3?`<span class="chipline more">+${es.length-3}</span>`:'');
    return `<button class="cell${inMonth?'':' oth'}${k===today?' today':''}${k===sel?' sel':''}" data-act="pick" data-d="${k}"><span>${c.getDate()}</span><em class="dots">${dots}</em><span class="chipsline">${chips}</span></button>`;
  });
  return h + `</div><div class="panel"><div class="ph"><b>${fmtLong(sel)}</b></div>${listHTML(sel)}</div>`;
}
function miniHTML() {
  const today = ds(new Date());
  let h = '<div class="mgrid">' + DOW.map(x => `<i>${x[0]}</i>`).join('');
  h += gridCells(monthAnchor, (c, inMonth) => {
    const k = ds(c), has = evOn(k).length > 0;
    return `<button class="mcell${inMonth?'':' oth'}${k===today?' today':''}${k===sel?' sel':''}" data-act="pick" data-d="${k}">${c.getDate()}${has?'<u></u>':''}</button>`;
  });
  return h + '</div>';
}
const START_H = 6, END_H = 24, ROWH = 56;
const timeMin = t => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60 + (m||0); };
function weekHTML() {
  const s = weekStartOf(sel), today = ds(new Date());
  const days = [...Array(7)].map((_,i) => addDays(s, i));
  const isWknd = k => { const g = pd(k).getDay(); return g === 0 || g === 6; };
  const head = days.map(k => { const d = pd(k);
    return `<div class="wg-day${isWknd(k)?' wknd':''}"><span class="wg-dow">${dowName(k)}</span><button class="wg-num${k===today?' today':''}${k===sel?' sel':''}" data-act="pick" data-d="${k}">${d.getDate()}</button></div>`; }).join('');
  const allrow = days.map(k => {
    const es = evOn(k).filter(e => !e.time);
    return `<div class="wg-allcol">${es.map(e => `<button class="wg-chip" data-act="edit" data-id="${e.id}" style="--c:${cat(e.cat).color}">${e.done?'✓ ':''}${esc(e.title)}</button>`).join('')}<button class="wg-add" data-act="quickadd" data-d="${k}">+</button></div>`; }).join('');
  const hourLabels = [...Array(END_H-START_H)].map((_,i) => `<div class="wg-hourrow">${String(START_H+i).padStart(2,'0')}:00</div>`).join('');
  const cols = days.map(k => {
    const es = evOn(k).filter(e => e.time);
    const blocks = es.map(e => { let m = timeMin(e.time); if (m == null) return '';
      const top = Math.max(0, m - START_H*60) / 60 * ROWH;
      const m2 = timeMin(e.time2);
      const h = m2 != null && m2 > m ? Math.max(26, (m2-m)/60*ROWH - 3) : 50;
      return `<button class="wg-block${e.done?' done':''}" data-act="edit" data-id="${e.id}" style="top:${top}px;height:${h}px;--c:${cat(e.cat).color}"><b>${timeRange(e)}</b> ${esc(e.title)}</button>`; }).join('');
    return `<div class="wg-col${isWknd(k)?' wknd':''}" data-act="colclick" data-d="${k}" style="height:${(END_H-START_H)*ROWH}px">${blocks}</div>`; }).join('');
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const inWeek = days.includes(today) && nowMin >= START_H*60 && nowMin <= END_H*60;
  const nowTop = (nowMin-START_H*60)/60*ROWH;
  const nowLine = inWeek ? `<div class="wg-now" style="top:${nowTop}px"></div>` : '';
  const nowLabel = inWeek ? `<div class="wg-nowlabel" style="top:${nowTop}px">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div>` : '';
  return `<div class="wgwrap"><div class="wg-stickytop"><div class="wg-head"><div class="wg-corner"></div>${head}</div>
  <div class="wg-alldays"><div class="wg-corner"></div>${allrow}</div></div>
  <div class="wg-body"><div class="wg-hours">${hourLabels}${nowLabel}</div><div class="wg-cols">${cols}${nowLine}</div></div></div>`;
}
const dayHTML = () => `<div class="panel">${listHTML(sel)}</div>`;

function sideHTML() {
  return `<div class="sidehead"><button class="btn pri" style="width:100%" data-act="today">Сегодня</button></div>
  <div id="mini">${miniHTML()}</div>
  <div class="sidecats"><label style="margin:0 0 6px">Категории</label>
  ${S.cats.map(c => `<button type="button" class="catrow${hiddenCats.has(c.id)?' off':''}" data-act="catfilter" data-id="${c.id}"><span class="catdot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}
  </div>`;
}

function render() {
  closeQuick();
  document.documentElement.dataset.theme = S.settings.theme;
  if (view === 'month') { $('#ttl').textContent = MON[monthAnchor.getMonth()] + ' ' + monthAnchor.getFullYear(); }
  else if (view === 'week') { const a = pd(weekStartOf(sel)), b = pd(addDays(weekStartOf(sel), 6));
    $('#ttl').textContent = a.getDate() + '–' + b.getDate() + ' ' + MONG[b.getMonth()].slice(0,3); }
  else $('#ttl').textContent = fmtLong(sel);
  document.querySelectorAll('.seg [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#main').classList.toggle('full', view === 'week');
  $('#main').innerHTML = view === 'month' ? monthHTML() : view === 'week' ? weekHTML() : dayHTML();
  $('#side').innerHTML = sideHTML();
}

function move(n) {
  if (view === 'month') { monthAnchor.setDate(1); monthAnchor.setMonth(monthAnchor.getMonth() + n); }
  else sel = addDays(sel, view === 'week' ? 7 * n : n);
  render();
}
const sheet = h => { $('#sh').innerHTML = h; $('#ov').classList.add('show'); };
const closeSheet = () => $('#ov').classList.remove('show');

function openQuick(date, time, x, y) {
  window._qc = { date };
  const qc = $('#qc');
  qc.innerHTML = `<div class="qhead"><b>${fmtLong(date)}</b><button class="qx" data-act="qclose">×</button></div>
  <input id="q_t" type="text" placeholder="Что запланировано?">
  <div class="qrow"><input id="q_tm" type="time" value="${time||''}"><input id="q_tm2" type="time" placeholder="Конец"></div>
  <select id="q_c">${S.cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <div class="qbtns"><button class="btn pri" data-act="qsave">Создать</button><button class="btn" data-act="qfull">Подробнее</button></div>`;
  qc.classList.add('show');
  const w = 280, h = 220;
  let left = Math.min(x, window.innerWidth - w - 12), top = Math.min(y, window.innerHeight - h - 12);
  qc.style.left = Math.max(8, left) + 'px'; qc.style.top = Math.max(8, top) + 'px';
  setTimeout(() => $('#q_t') && $('#q_t').focus(), 30);
}
const closeQuick = () => $('#qc').classList.remove('show');

function openEvent(id, presetDate, presetTime) {
  const e = id ? S.events.find(x => x.id === id) : { title:'', date:presetDate||sel, time:presetTime||'', cat:S.cats[0] && S.cats[0].id, note:'', reminder:{enabled:false, offset:15, repeat:'none', days:[]} };
  const r = Object.assign({enabled:false, offset:15, repeat:'none', days:[]}, e.reminder || {});
  sheet(`<h3>${id?'Событие':'Новое событие'}</h3>
  <input id="f_t" placeholder="Что запланировано?" value="${esc(e.title)}">
  <select id="f_c">${S.cats.map(c => `<option value="${c.id}"${c.id===e.cat?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <label>Время</label>
  <div class="row"><div style="flex:1.3"><label style="margin-top:0">Дата</label><input id="f_d" type="date" value="${e.date}"></div><div><label style="margin-top:0">Начало</label><input id="f_tm" type="time" value="${e.time||''}"></div><div><label style="margin-top:0">Конец</label><input id="f_tm2" type="time" value="${e.time2||''}"></div></div>
  <div class="chkrow"><input type="checkbox" id="f_rem_on"${r.enabled?' checked':''}><label style="margin:0">Напомнить заранее</label></div>
  <div id="rem_opts" style="display:${r.enabled?'block':'none'}">
    <label style="margin-top:0">За сколько до события</label>
    <select id="f_rem_off">
      <option value="0"${r.offset==0?' selected':''}>Ровно во время</option>
      <option value="5"${r.offset==5?' selected':''}>За 5 минут</option>
      <option value="10"${r.offset==10?' selected':''}>За 10 минут</option>
      <option value="15"${r.offset==15?' selected':''}>За 15 минут</option>
      <option value="30"${r.offset==30?' selected':''}>За 30 минут</option>
      <option value="60"${r.offset==60?' selected':''}>За 1 час</option>
      <option value="1440"${r.offset==1440?' selected':''}>За 1 день</option>
    </select>
    <label>Повтор</label>
    <select id="f_rem_rep">
      <option value="none"${r.repeat==='none'?' selected':''}>Не повторять</option>
      <option value="daily"${r.repeat==='daily'?' selected':''}>Каждый день</option>
      <option value="custom"${r.repeat==='custom'?' selected':''}>По выбранным дням</option>
    </select>
    <div id="rem_days" class="chips" style="display:${r.repeat==='custom'?'flex':'none'}">${DOW.map((d,i) => `<button type="button" class="chip${(r.days||[]).includes(i)?' on':''}" data-act="remday" data-d="${i}">${d}</button>`).join('')}</div>
  </div>
  <textarea id="f_n" placeholder="Заметка">${esc(e.note||'')}</textarea>
  <div class="row"><button class="btn pri" data-act="save" data-id="${id||''}">Сохранить</button>${id?`<button class="btn dng" data-act="del" data-id="${id}">Удалить</button>`:''}<button class="btn" data-act="close">Отмена</button></div>`);
  window._remDays = new Set(r.days || []);
}
function openSettings() {
  const st = S.settings;
  sheet(`<h3>Настройки</h3>
  <label>Тема</label><select id="s_theme"><option value="auto"${st.theme==='auto'?' selected':''}>Как в системе</option><option value="light"${st.theme==='light'?' selected':''}>Светлая</option><option value="dark"${st.theme==='dark'?' selected':''}>Тёмная</option><option value="black"${st.theme==='black'?' selected':''}>Чёрная</option></select>
  <label>Неделя начинается с</label><select id="s_ws"><option value="1"${st.weekStart===1?' selected':''}>Понедельника</option><option value="0"${st.weekStart===0?' selected':''}>Воскресенья</option></select>
  <label>Категории и цвета</label>
  ${S.cats.map(c => `<div class="row cr"><input type="color" data-cat="${c.id}" data-f="color" value="${c.color}"><input data-cat="${c.id}" data-f="name" value="${esc(c.name)}"><button class="btn dng" data-act="delcat" data-id="${c.id}">✕</button></div>`).join('')}
  <button class="btn" style="width:100%;margin-bottom:14px" data-act="addcat">+ Категория</button>
  <label>Уведомления</label><button class="btn pri" style="width:100%" data-act="push">Включить уведомления</button><div id="plog"></div>
  <button class="btn" style="width:100%;margin-top:14px" data-act="close">Готово</button>`);
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if ($('#qc').classList.contains('show') && !$('#qc').contains(ev.target) && !(el && (el.dataset.act === 'colclick' || el.dataset.act === 'quickadd'))) closeQuick();
  if (ev.target.id === 'ov') return closeSheet();
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'prev') move(-1); else if (a === 'next') move(1);
  else if (a === 'v') { view = el.dataset.v; if (view === 'month') { monthAnchor = pd(sel); monthAnchor.setDate(1); } render(); }
  else if (a === 'today') { sel = ds(new Date()); monthAnchor = pd(sel); monthAnchor.setDate(1); render(); }
  else if (a === 'pick') { sel = el.dataset.d; render(); }
  else if (a === 'goday') { sel = el.dataset.d; view = 'day'; render(); }
  else if (a === 'quickadd') { openQuick(el.dataset.d, '', ev.clientX, ev.clientY); }
  else if (a === 'colclick') {
    const rect = el.getBoundingClientRect();
    let hour = START_H + Math.floor((ev.clientY - rect.top) / ROWH);
    hour = Math.max(START_H, Math.min(23, hour));
    openQuick(el.dataset.d, String(hour).padStart(2,'0') + ':00', ev.clientX, ev.clientY);
  }
  else if (a === 'qclose') closeQuick();
  else if (a === 'qsave') {
    const title = $('#q_t').value.trim(); if (!title) { $('#q_t').focus(); return; }
    S.events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), done:false,
      title, date: window._qc.date, time: $('#q_tm').value, cat: $('#q_c').value, note:'',
      reminder:{enabled:false, offset:15, repeat:'none', days:[]} });
    sel = window._qc.date; save(); closeQuick(); render();
  }
  else if (a === 'qfull') { const d = window._qc.date, t = $('#q_tm').value, ttl = $('#q_t').value.trim();
    closeQuick(); sel = d; openEvent(); if (ttl) $('#f_t').value = ttl; if (t) $('#f_tm').value = t; }
  else if (a === 'add') openEvent();
  else if (a === 'edit') openEvent(id);
  else if (a === 'toggle') { const e = S.events.find(x => x.id === id); e.done = !e.done; save(); render(); }
  else if (a === 'close') closeSheet();
  else if (a === 'settings') openSettings();
  else if (a === 'catfilter') { hiddenCats.has(id) ? hiddenCats.delete(id) : hiddenCats.add(id); render(); }
  else if (a === 'remday') { const d = Number(el.dataset.d); window._remDays.has(d) ? window._remDays.delete(d) : window._remDays.add(d); el.classList.toggle('on'); }
  else if (a === 'save') {
    const title = $('#f_t').value.trim(); if (!title) { $('#f_t').focus(); return; }
    const reminder = { enabled: $('#f_rem_on').checked, offset: Number($('#f_rem_off') ? $('#f_rem_off').value : 15), repeat: $('#f_rem_rep') ? $('#f_rem_rep').value : 'none', days: [...(window._remDays||[])] };
    const data = { title, date: $('#f_d').value || sel, time: $('#f_tm').value, time2: $('#f_tm2').value, cat: $('#f_c').value, note: $('#f_n').value.trim(), reminder };
    if (id) Object.assign(S.events.find(x => x.id === id), data);
    else S.events.push(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), done:false }, data));
    sel = data.date; save(); closeSheet(); render();
  }
  else if (a === 'del') { S.events = S.events.filter(x => x.id !== id); save(); closeSheet(); render(); }
  else if (a === 'addcat') { S.cats.push({ id:'c' + Date.now().toString(36), name:'Новая', color:'#f59e0b' }); save(); openSettings(); }
  else if (a === 'delcat') { if (S.cats.length > 1) { S.cats = S.cats.filter(c => c.id !== id); save(); openSettings(); render(); } }
  else if (a === 'push') enablePush();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 's_theme') { S.settings.theme = t.value; save(); render(); }
  else if (t.id === 's_ws') { S.settings.weekStart = Number(t.value); save(); render(); }
  else if (t.dataset.cat) { S.cats.find(c => c.id === t.dataset.cat)[t.dataset.f] = t.value; save(); render(); }
  else if (t.id === 'f_rem_on') { $('#rem_opts').style.display = t.checked ? 'block' : 'none'; }
  else if (t.id === 'f_rem_rep') { $('#rem_days').style.display = t.value === 'custom' ? 'flex' : 'none'; }
});

// ---- Свайп между периодами ----
let tsx = 0, tsy = 0;
document.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!e.changedTouches || $('#ov').classList.contains('show')) return;
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
}, {passive:true});

// ---- Уведомления ----
const plog = t => { const l = $('#plog'); if (l) l.textContent += (l.textContent ? '\n' : '') + t; };
const b64 = v => { const raw = atob((v + '='.repeat((4 - v.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); };
async function enablePush() {
  try {
    if (navigator.standalone !== true) return plog('Откройте приложение с экрана «Домой», а не из Safari.');
    if (!('PushManager' in window)) return plog('Уведомления не поддерживаются.');
    const reg = await navigator.serviceWorker.ready;
    if (await Notification.requestPermission() !== 'granted') return plog('Разрешение на уведомления не выдано.');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const r = await fetch(SUPABASE_URL + '/rest/v1/push_subscriptions', { method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth }) });
    plog(r.ok || r.status === 409 ? 'Уведомления включены.' : 'Ошибка сохранения: ' + r.status);
  } catch (e) { plog('Ошибка: ' + e.message); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
