<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Напоминалка">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Напоминалка</title>
<style>
:root{--bg:#ffffff;--card:#fff;--tx:#15171a;--mut:#6b7280;--line:#dfe2e6;--acc:#1f2430;--accfg:#fff;--dng:#b42318;--grid:#e1e4e8;--wk:rgba(0,0,0,.025);--side:#f6f7f9;--hl:#eceef1;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08090c;--card:#12151d;--tx:#eef0f3;--mut:#8b93a3;--line:#232733;--acc:#e08a3c;--accfg:#1a0f02;--dng:#f87171;--grid:#2a303d;--wk:rgba(255,255,255,.03);--side:#0e1117;--hl:#1b202b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#08090c;--card:#12151d;--tx:#eef0f3;--mut:#8b93a3;--line:#232733;--acc:#e08a3c;--accfg:#1a0f02;--dng:#f87171;--grid:#2a303d;--wk:rgba(255,255,255,.03);--side:#0e1117;--hl:#1b202b;color-scheme:dark}
:root[data-theme=black]{--bg:#000000;--card:#141414;--tx:#f2f2f2;--mut:#9a9a9a;--line:#272727;--acc:#e6e6e6;--accfg:#111111;--dng:#f87171;--grid:#2d2d2d;--wk:rgba(255,255,255,.035);--side:#0c0c0c;--hl:#1f1f1f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:block}
.content{padding-bottom:24px}
#side{display:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px}
h1{flex:1;min-width:0;margin:0;font-size:19px;font-weight:700;text-align:center;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:900px){h1{font-size:21px}}
.ic{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:18px;line-height:1}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:9px;background:transparent;font-size:14px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
main{padding:12px 14px;max-width:960px;margin:0 auto}
main.full{max-width:none}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dw{font-style:normal;text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cell{min-width:0;overflow:hidden;aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:15px}
.cell.oth{opacity:.4}
.cell.today .dn{background:var(--acc);color:var(--accfg);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:700}
.cell.sel{outline:2px solid var(--acc);outline-offset:-1px}
.cell em{display:flex;gap:2px;min-height:7px}
.cell u{width:6px;height:6px;border-radius:50%}
.chipsline{display:none}
.chipline{display:block;width:100%;padding:3px 7px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;background:color-mix(in srgb, var(--card) 78%, var(--c) 26%);color:color-mix(in srgb, var(--c) 70%, var(--tx) 30%)}
.chipline.more{background:none!important;color:var(--mut);font-weight:500;padding-left:7px}
.wgwrap{overflow:auto;max-height:68vh}
.wg-stickytop{position:sticky;top:0;z-index:3;background:var(--bg)}
.wg-head,.wg-alldays{display:grid;grid-template-columns:56px repeat(var(--n,7),minmax(130px,1fr))}
.wg-corner{border-bottom:1px solid var(--grid)}
.wg-day{padding:8px 4px;text-align:center;border-bottom:1px solid var(--grid);border-left:1px solid var(--grid)}
.wg-day.wknd{background:var(--wk)}
.wg-dow{display:block;font-size:11px;color:var(--mut)}
.wg-num{margin-top:2px;width:28px;height:28px;border-radius:50%;border:0;background:none;color:var(--tx);font-size:15px;font-weight:600}
.wg-num.today{background:var(--acc);color:var(--accfg)}
.wg-num.sel:not(.today){outline:1px solid var(--acc);outline-offset:-1px}
.wg-alldays{min-height:34px}
.wg-allcol{border-left:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:5px;display:flex;flex-direction:column;gap:3px;min-height:34px;cursor:pointer}
.wg-allcol:hover{background:var(--wk)}
.wg-chip{text-align:left;border:0;border-radius:6px;padding:3px 7px;font-size:11.5px;font-weight:600;background:color-mix(in srgb, var(--card) 78%, var(--c) 26%);color:color-mix(in srgb, var(--c) 70%, var(--tx) 30%)}
.wg-body{display:flex;padding-top:8px}
.wg-hours{width:56px;flex:none;position:relative}
.wg-nowlabel{position:absolute;right:6px;transform:translateY(-50%);color:#e5484d;font-weight:700;font-size:11px;background:var(--bg);padding-left:4px}
.wg-hourrow{height:56px;font-size:10.5px;color:var(--mut);padding-right:7px;text-align:right;box-sizing:border-box;transform:translateY(-6px)}
.wg-cols{position:relative;display:grid;grid-template-columns:repeat(var(--n,7),minmax(130px,1fr));flex:1}
.wg-col{position:relative;border-left:1px solid var(--grid);background-image:repeating-linear-gradient(180deg, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 56px)}
.wg-col.wknd{background-color:var(--wk)}
.wg-block{position:absolute;left:3px;right:3px;height:50px;border:0;border-left:3px solid var(--c);border-radius:6px;padding:3px 7px;font-size:11.5px;text-align:left;background:color-mix(in srgb, var(--card) 74%, var(--c) 30%);color:color-mix(in srgb, var(--c) 70%, var(--tx) 30%);font-weight:600;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.wg-block{cursor:grab;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wg-block b{font-weight:700}
.wg-rs{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize}
.wg-rs::after{content:'';position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:.35}
.wg-block.dragging{z-index:4;cursor:grabbing;box-shadow:0 8px 22px rgba(0,0,0,.35);opacity:.95}
body.dragmode{-webkit-user-select:none;user-select:none;cursor:grabbing}
.wg-block.done{opacity:.5;text-decoration:line-through}
.wg-now{position:absolute;left:0;right:0;height:0;border-top:2px solid #e5484d;z-index:2}
.wg-now::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#e5484d}
@media(min-width:900px){
  .seg-month{display:none}
  .wg-head,.wg-alldays{grid-template-columns:60px repeat(var(--n,7),1fr)}
  .wg-cols{grid-template-columns:repeat(var(--n,7),1fr)}
  .wg-hours,.wg-corner{width:60px}
  .wgwrap{max-height:calc(100vh - 150px);overflow-x:hidden}
}
.dayview{display:flex;flex-direction:column;gap:14px}
.daygrid{min-width:0}
.wgwrap.one .wg-day{text-align:left;padding-left:12px}
.dayside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.ds-head b{display:block;font-size:20px;letter-spacing:-.01em}
.ds-head small{color:var(--mut);font-size:13px}
.ds-prog{margin:14px 0 12px}
.ds-bar{height:6px;border-radius:3px;background:var(--hl);overflow:hidden}
.ds-bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.ds-prog span{display:block;margin-top:6px;font-size:13px;color:var(--mut)}
.ds-next{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);border-radius:10px;padding:9px 12px;margin-bottom:12px;background:color-mix(in srgb, var(--card) 80%, var(--c) 20%);cursor:pointer}
.ds-next small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ds-next b{font-size:14px;color:color-mix(in srgb, var(--c) 70%, var(--tx) 30%)}
.ds-new{width:100%;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);font-size:14px;margin-bottom:6px}
.ds-new:focus{outline:0;border-style:solid;border-color:var(--acc)}
.ds-sec{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.ds-sec span{font-weight:600}
@media(min-width:900px){
  .dayview{flex-direction:row;align-items:flex-start}
  .daygrid{flex:1}
  .dayside{width:330px;flex:none;position:sticky;top:0;max-height:calc(100vh - 150px);overflow-y:auto}
}
.panel,.wd{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.ph,.wh{font-size:15px;margin-bottom:8px}
.wd.today{border-color:var(--acc)}
.wh{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font-weight:600}
.ev{display:flex;align-items:stretch;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.bar{width:5px;border-radius:3px;flex:none}
.chk{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;background:none;flex:none;align-self:center;font-size:15px;padding:0}
.done .chk{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.evb{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.evb b{display:block;font-weight:600}
.evb small{color:var(--mut)}
.evb p{margin:4px 0 0;font-size:14px;color:var(--mut);white-space:pre-wrap}
.done .evb b{text-decoration:line-through;opacity:.55}
.empty{color:var(--mut);font-size:14px;margin:0}
.ic.new{width:auto;padding:0 12px;font-size:14px;font-weight:600;background:var(--acc);border-color:var(--acc);color:var(--accfg)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.show{display:flex}
#sh{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#sh h3{margin:0 0 14px}
#f_t{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 0 10px;font-size:19px;font-weight:600;margin-bottom:14px}
#f_t:focus{outline:0;border-color:var(--acc)}
#sh select,#sh textarea,#sh input[type=date],#sh input[type=time]{width:100%;padding:11px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#sh textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:flex-start}
.row>*{flex:1;margin-bottom:10px}
.btn{padding:11px;border:1px solid var(--line);border-radius:10px;background:transparent}
.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.newbtn{width:100%;background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:700;border-radius:24px;padding:12px}
.dng{color:var(--dng)}
.catlist{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--bg)}
.catedit{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 12px;border-top:1px solid var(--line)}
.catlist>.catedit:first-child{border-top:0}
.cswatch{width:26px;height:26px;border-radius:50%;border:0;padding:0;flex:none;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px color-mix(in srgb, var(--c) 55%, transparent);cursor:pointer}
.cname{flex:1;min-width:0;border:0;background:transparent;padding:10px 2px;font-size:15px;border-radius:0}
.cname:focus{outline:0;box-shadow:inset 0 -2px 0 var(--acc)}
.cdel{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--mut);display:grid;place-items:center;flex:none;cursor:pointer}
.cdel:hover{background:var(--hl);color:var(--dng)}
.cdel:disabled{opacity:.3;cursor:not-allowed;background:none;color:var(--mut)}
.catedit.ask{background:color-mix(in srgb, var(--dng) 10%, var(--bg))}
.askt{flex:1;min-width:0;font-size:14px;font-weight:600;padding:8px 0;line-height:1.3;overflow-wrap:anywhere}
.askyes{border:0;border-radius:8px;padding:8px 10px;flex:none;background:var(--dng);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.askno{border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:none;background:none;font-size:13px;cursor:pointer}
.cpal{display:flex;flex-wrap:wrap;gap:10px;padding:4px 12px 12px 50px}
.cdot{display:block;width:24px;height:24px;margin:0;border-radius:50%;border:0;padding:0;background:var(--c);cursor:pointer;position:relative}
.cdot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.cdot.custom{background:conic-gradient(#ef4444,#eab308,#22c55e,#38bdf8,#6366f1,#ec4899,#ef4444);overflow:hidden}
.cdot.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.addcat{width:100%;padding:11px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--mut);margin-bottom:14px;font-size:14px;cursor:pointer}
.addcat:hover{color:var(--tx);border-color:var(--mut)}
#plog{font-size:13px;color:var(--mut);white-space:pre-wrap;margin:6px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 4px;font-weight:600}
.qc{position:fixed;z-index:25;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:14px;width:280px}
.qc.show{display:block}
.qc .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qc .qhead b{font-size:13px}
.qc .qx{border:0;background:none;color:var(--mut);font-size:18px;line-height:1;padding:2px 4px}
.qc input[type=text],.qc input[type=time],.qc select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px;box-sizing:border-box}
.qc .qrow{display:flex;gap:6px}
.qc .qrow>*{flex:1}
.qc .qbtns{display:flex;gap:6px;margin-top:2px}
.qc .qbtns .btn{flex:1;padding:8px;font-size:13px}
.chkrow{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:15px}
.chkrow input{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{padding:7px 11px;border:1px solid var(--line);border-radius:20px;background:var(--bg);font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
@media(min-width:900px){
  .app{display:flex;min-height:100vh}
  #side{display:block;width:280px;flex:none;border-right:1px solid var(--line);padding:18px 16px 24px;background:var(--side);position:sticky;top:0;height:100vh;overflow-y:auto}
  .ic.new{display:none}
  .content{flex:1;min-width:0}
  main{padding:20px 24px}
  .sb-top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
  .sb-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .sb-ic{width:34px;height:34px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--tx)}
  .sb-ic:hover{background:var(--hl)}
  .newbtn{width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;background:var(--acc);color:var(--accfg)}
  .mini-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
  .mini-head b{font-size:15px}
  .mini-head button{border:0;background:none;font-size:18px;width:30px;height:30px;border-radius:8px;color:var(--tx)}
  .mini-head button:hover{background:var(--hl)}
  #mini .mgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
  #mini .mgrid i{font-style:normal;text-align:center;font-size:11px;color:var(--mut);padding-bottom:6px}
  #mini .mcell{height:38px;border:0;background:none;font-size:13px;color:var(--tx);position:relative;padding:3px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
  #mini .mcell span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
  #mini .mcell:hover span{background:var(--hl)}
  #mini .mcell.oth{color:var(--mut)}
  #mini .mcell.wk{background:var(--hl)}
  #mini .mcell.wk.l{border-radius:8px 0 0 8px}
  #mini .mcell.wk.r{border-radius:0 8px 8px 0}
  #mini .mcell.sel span{background:var(--acc);color:var(--accfg);font-weight:700}
  #mini .mcell.today span{background:#e5484d;color:#fff;font-weight:700}
  #mini .md{display:flex;gap:2px;height:4px;margin-top:3px}
  #mini .md u{width:4px;height:4px;border-radius:50%;flex:none}
  .sb-sec{margin-top:22px}
  .sb-h{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;margin:0 2px 8px;background:none;border:0;padding:0;color:var(--tx)}
  .sb-cat{display:flex;align-items:center;gap:10px;width:100%;padding:6px 4px;font-size:14px;background:none;border:0;text-align:left;border-radius:8px;color:var(--tx)}
  .sb-cat:hover{background:var(--hl)}
  .sb-box{width:18px;height:18px;border-radius:5px;border:2px solid var(--c);display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
  .sb-cat.on .sb-box{background:var(--c)}
  .sb-add{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px;font-size:14px;background:none;border:0;color:var(--mut);border-radius:8px;text-align:left}
  .sb-add:hover{background:var(--hl);color:var(--tx)}
  .tpl{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 12px;margin-bottom:8px;background:color-mix(in srgb, var(--side) 78%, var(--c) 22%);color:var(--tx)}
  .tpl b{display:block;font-size:14px;color:color-mix(in srgb, var(--c) 75%, var(--tx) 25%)}
  .tpl small{font-size:12.5px;color:color-mix(in srgb, var(--c) 55%, var(--tx) 45%)}
  .tpl .tpx{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--mut);font-size:15px;opacity:0;padding:2px 5px}
  .tpl:hover .tpx{opacity:1}
  .grid{gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cell{aspect-ratio:auto;min-height:128px;align-items:flex-start;justify-content:flex-start;padding:9px;position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0}
  .cell .dn{align-self:flex-start}
  .cell.today .dn{width:26px;height:26px;border-radius:50%}
  .cell.sel{outline:1px solid var(--acc);outline-offset:-2px}
  .cell em.dots{display:none}
  .chipsline{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:6px;overflow:hidden}
  .dw{padding:8px 0;text-align:left;padding-left:8px}
  #ov{background:rgba(0,0,0,.15);align-items:stretch;justify-content:flex-end}
  #sh{width:380px;max-width:380px;height:100vh;max-height:100vh;border-radius:0;box-shadow:-10px 0 28px rgba(0,0,0,.18)}
}
@media(hover:hover){.cell:hover{outline:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <div class="content">
    <header>
      <div class="top"><button class="ic" data-act="prev">‹</button><h1 id="ttl"></h1><button class="ic" data-act="next">›</button><button class="ic new" data-act="add">Создать</button><button class="ic" data-act="settings">⚙︎</button></div>
      <div class="seg"><button class="seg-month" data-act="v" data-v="month">Месяц</button><button data-act="v" data-v="week">Неделя</button><button data-act="v" data-v="day">День</button><button data-act="today">Сегодня</button></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="ov"><div id="sh"></div></div>
<div id="qc" class="qc"></div>

<script>
const SUPABASE_URL = 'https://zgasnvubcdprgsypkglh.supabase.co';

function evHTML(e) {

}
const listHTML = k => { const es = evOn(k); return es.length ? es.map(evHTML).join('') : '<p class="empty">Событий нет</p>'; };

function gridCells(anchor, fn) {
  const d = new Date(anchor);
  const off = S.settings.weekStart === 1 ? (d.getDay()+6)%7 : d.getDay();
  const n = Math.ceil((off + new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()) / 7) * 7;
  let h = '';
  for (let i = 0; i < n; i++) { const c = new Date(d); c.setDate(1 - off + i); h += fn(c, c.getMonth() === d.getMonth()); }
  return h;
}
function monthHTML() {
  const today = ds(new Date());

  let h = '<div class="grid">' + dows.map(x => `<i class="dw">${x}</i>`).join('');
  h += gridCells(monthAnchor, (c, inMonth) => {
    const k = ds(c), es = evOn(k);
    const dots = es.slice(0,4).map(e => `<u style="background:${cat(e.cat).color}"></u>`).join('');
    const chips = es.slice(0,3).map(e => `<span class="chipline" style="--c:${cat(e.cat).color}">${esc(e.title)}</span>`).join('') + (es.length>3?`<span class="chipline more">+${es.length-3}</span>`:'');

}

  });

}
const START_H = 6, END_H = 24, ROWH = 56;
const timeMin = t => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60 + (m||0); };
const weekHTML = () => { const s = weekStartOf(sel); return gridHTML([...Array(7)].map((_,i) => addDays(s, i))); };
function gridHTML(days) {
  const today = ds(new Date());

  const hourLabels = [...Array(END_H-START_H)].map((_,i) => `<div class="wg-hourrow">${String(START_H+i).padStart(2,'0')}:00</div>`).join('');
  const cols = days.map(k => {
    const es = evOn(k).filter(e => e.time);
    const blocks = es.map(e => { let m = timeMin(e.time); if (m == null) return '';
      const top = Math.max(0, m - START_H*60) / 60 * ROWH;
      const m2 = timeMin(e.time2);
      const h = m2 != null && m2 > m ? Math.max(22, (m2-m)/60*ROWH - 3) : ROWH - 3;
      return `<button class="wg-block${e.done?' done':''}" data-act="edit" data-id="${e.id}" style="top:${top}px;height:${h}px;--c:${cat(e.cat).color}"><b>${timeRange(e)}</b> ${esc(e.title)}<span class="wg-rs" aria-hidden="true"></span></button>`; }).join('');
    return `<div class="wg-col${isWknd(k)?' wknd':''}" data-act="colclick" data-d="${k}" style="height:${(END_H-START_H)*ROWH}px">${blocks}</div>`; }).join('');
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const inWeek = days.includes(today) && nowMin >= START_H*60 && nowMin <= END_H*60;
  const nowTop = (nowMin-START_H*60)/60*ROWH;
  const nowLine = inWeek ? `<div class="wg-now" style="top:${nowTop}px"></div>` : '';
  const nowLabel = inWeek ? `<div class="wg-nowlabel" style="top:${nowTop}px">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div>` : '';
  return `<div class="wgwrap${days.length === 1 ? ' one' : ''}" style="--n:${days.length}"><div class="wg-stickytop"><div class="wg-head"><div class="wg-corner"></div>${head}</div>

  <div class="wg-body"><div class="wg-hours">${hourLabels}${nowLabel}</div><div class="wg-cols">${cols}${nowLine}</div></div></div>`;
}
const DOWF = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
function dayHTML() {
  const es = evOn(sel), allDay = es.filter(e => !e.time), timed = es.filter(e => e.time);

  </div>`;
}

let lastGridView = null;
function render() {
  closeQuick();
  document.documentElement.dataset.theme = S.settings.theme;
  if (view === 'month') { $('#ttl').textContent = MON[monthAnchor.getMonth()] + ' ' + monthAnchor.getFullYear(); }

  $('#main').innerHTML = view === 'month' ? monthHTML() : view === 'week' ? weekHTML() : dayHTML();

    if (oldTop != null && lastGridView === view) w.scrollTop = oldTop;
    else w.scrollTop = Math.max(0, new Date().getHours() - 1 - START_H) * ROWH;

function move(n) {
  if (view === 'month') { monthAnchor.setDate(1); monthAnchor.setMonth(monthAnchor.getMonth() + n); }
  else { sel = addDays(sel, view === 'week' ? 7 * n : n); syncMini(); }
  render();
}

const PALETTE = ['#ef4444','#f97316','#f59e0b','#eab308','#22c55e','#14b8a6','#38bdf8','#3b82f6','#6366f1','#a855f7','#ec4899','#64748b'];

    <button class="cswatch" data-act="catpal" data-id="${c.id}" style="--c:${c.color}" aria-label="Выбрать цвет"></button>
    <input class="cname" data-cat="${c.id}" data-f="name" value="${esc(c.name)}" placeholder="Название категории">
    <button class="cdel" data-act="delcat" data-id="${c.id}" aria-label="Удалить категорию"${S.cats.length <= 1 ? ' disabled title="Нужна хотя бы одна категория"' : ''}>${TRASH_SVG}</button></div>
    ${palOpen === c.id ? `<div class="cpal">${PALETTE.map(col => `<button class="cdot${col.toLowerCase() === c.color.toLowerCase() ? ' on' : ''}" data-act="setcolor" data-id="${c.id}" data-c="${col}" style="--c:${col}" aria-label="${col}"></button>`).join('')}<label class="cdot custom" title="Свой цвет"><input type="color" data-cat="${c.id}" data-f="color" value="${c.color}"></label></div>` : ''}`).join('')}</div>
  <button class="addcat" data-act="addcat">+ Добавить категорию</button>
  <label>Уведомления</label><button class="btn pri" style="width:100%" data-act="push">Включить уведомления</button><div id="plog"></div>
  <button class="btn" style="width:100%;margin-top:14px" data-act="close">Готово</button>`);
  $('#sh').scrollTop = keep;
}

document.addEventListener('click', async ev => {
  if (Date.now() - lastDragEnd < 200) return;
  const el = ev.target.closest('[data-act]');
  if ($('#qc').classList.contains('show') && !$('#qc').contains(ev.target) && !(el && (el.dataset.act === 'colclick' || el.dataset.act === 'quickadd'))) closeQuick();
  if (ev.target.id === 'ov') return closeSheet();
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'prev') move(-1); else if (a === 'next') move(1);
  else if (a === 'v') { view = el.dataset.v; if (view === 'month') { monthAnchor = pd(sel); monthAnchor.setDate(1); } render(); }
  else if (a === 'today') { sel = ds(new Date()); monthAnchor = pd(sel); monthAnchor.setDate(1); syncMini(); render(); }
  else if (a === 'mprev' || a === 'mnext') { miniAnchor.setDate(1); miniAnchor.setMonth(miniAnchor.getMonth() + (a === 'mnext' ? 1 : -1)); render(); }
  else if (a === 'tpltoggle') { S.settings.tplOpen = S.settings.tplOpen === false; save(); render(); }
  else if (a === 'deltpl') { ev.stopPropagation(); S.templates = S.templates.filter(t => t.id !== id); save(); render(); }
  else if (a === 'usetpl') { const t = S.templates.find(x => x.id === id); if (t) openEvent(null, { title:t.title, cat:t.cat, time:t.time, time2:t.time2 }); }
  else if (a === 'savetpl') {
    const title = $('#f_t').value.trim(); if (!title) { $('#f_t').focus(); return; }
    S.templates.push({ id:'t' + Date.now().toString(36), title, cat:$('#f_c').value, time:$('#f_tm').value, time2:$('#f_tm2').value });
    save(); el.textContent = 'Сохранено в шаблоны ✓'; el.disabled = true; render();
  }
  else if (a === 'search') {
    sheet(`<h3>Поиск</h3><input id="s_q" type="text" placeholder="Название или заметка" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px"><div id="s_res"><p class="empty">Начните вводить текст</p></div><button class="btn" style="width:100%;margin-top:10px" data-act="close">Закрыть</button>`);
    setTimeout(() => $('#s_q') && $('#s_q').focus(), 30);
  }
  else if (a === 'gores') { const e = S.events.find(x => x.id === id); if (e) { sel = e.date; syncMini(); closeSheet(); render(); openEvent(id); } }
  else if (a === 'pick') { sel = el.dataset.d; render(); }
  else if (a === 'goday') { sel = el.dataset.d; view = 'day'; render(); }
  else if (a === 'quickadd') { openQuick(el.dataset.d, '', ev.clientX, ev.clientY); }
  else if (a === 'colclick') {
    const rect = el.getBoundingClientRect();
    let mins = START_H*60 + Math.floor((ev.clientY - rect.top) / ROWH * 4) * 15;
    mins = Math.max(START_H*60, Math.min(23*60 + 45, mins));
    openQuick(el.dataset.d, fmtMin(mins), ev.clientX, ev.clientY);
  }
  else if (a === 'qclose') closeQuick();
  else if (a === 'qsave') {
    const title = $('#q_t').value.trim(); if (!title) { $('#q_t').focus(); return; }
    S.events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), done:false,
      title, date: window._qc.date, time: $('#q_tm').value, time2: $('#q_tm2').value, cat: $('#q_c').value, note:'',
      reminder:{enabled:false, offset:15, repeat:'none', days:[]} });
    sel = window._qc.date; save(); closeQuick(); render();
  }
  else if (a === 'qfull') { const d = window._qc.date, t = $('#q_tm').value, t2 = $('#q_tm2').value, ttl = $('#q_t').value.trim();
    closeQuick(); sel = d; openEvent(null, { title:ttl, date:d, time:t, time2:t2, cat:$('#q_c') ? $('#q_c').value : '' }); }
  else if (a === 'add') openEvent();
  else if (a === 'edit') openEvent(id);
  else if (a === 'toggle') { const e = S.events.find(x => x.id === id); e.done = !e.done; save(); render(); }
  else if (a === 'close') closeSheet();
  else if (a === 'settings') { palOpen = null; delAsk = null; openSettings(); }
  else if (a === 'catfilter') { hiddenCats.has(id) ? hiddenCats.delete(id) : hiddenCats.add(id); render(); }
  else if (a === 'remday') { const d = Number(el.dataset.d); window._remDays.has(d) ? window._remDays.delete(d) : window._remDays.add(d); el.classList.toggle('on'); }
  else if (a === 'save') {
    const title = $('#f_t').value.trim(); if (!title) { $('#f_t').focus(); return; }
    const reminder = { enabled: $('#f_rem_on').checked, offset: Number($('#f_rem_off') ? $('#f_rem_off').value : 15), repeat: $('#f_rem_rep') ? $('#f_rem_rep').value : 'none', days: [...(window._remDays||[])] };
    const data = { title, date: $('#f_d').value || sel, time: $('#f_tm').value, time2: $('#f_tm2').value, cat: $('#f_c').value, note: $('#f_n').value.trim(), reminder };
    if (id) Object.assign(S.events.find(x => x.id === id), data);
    else S.events.push(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), done:false }, data));
    sel = data.date; save(); closeSheet(); render();
  }
  else if (a === 'del') { S.events = S.events.filter(x => x.id !== id); save(); closeSheet(); render(); }
  else if (a === 'addcat') {
    const used = S.cats.map(c => c.color.toLowerCase()), nid = 'c' + Date.now().toString(36);
    S.cats.push({ id:nid, name:'Новая категория', color: PALETTE.find(c => !used.includes(c)) || PALETTE[S.cats.length % PALETTE.length] });
    palOpen = null; save(); render(); openSettings();
    setTimeout(() => { const i = document.querySelector(`.cname[data-cat="${nid}"]`); if (i) { i.focus(); i.select(); } }, 60);
  }
  else if (a === 'catpal') { palOpen = palOpen === id ? null : id; openSettings(); }
  else if (a === 'setcolor') { const c = S.cats.find(x => x.id === id); if (c) { c.color = el.dataset.c; save(); render(); openSettings(); } }
  else if (a === 'delcat') { if (S.cats.length > 1) { delAsk = id; palOpen = null; openSettings(); } }
  else if (a === 'delyes') {
    if (S.cats.length > 1) { S.cats = S.cats.filter(x => x.id !== id); hiddenCats.delete(id); }
    delAsk = null; if (palOpen === id) palOpen = null; save(); render(); openSettings();
  }
  else if (a === 'delno') { delAsk = null; openSettings(); }
  else if (a === 'push') enablePush();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 's_theme') { S.settings.theme = t.value; save(); render(); }
  else if (t.id === 's_ws') { S.settings.weekStart = Number(t.value); save(); render(); }
  else if (t.dataset.cat) {
    S.cats.find(c => c.id === t.dataset.cat)[t.dataset.f] = t.value; save(); render();
    if (t.dataset.f === 'color') { const sw = document.querySelector(`.cswatch[data-id="${t.dataset.cat}"]`); if (sw) sw.style.setProperty('--c', t.value); document.querySelectorAll(`.cdot[data-id="${t.dataset.cat}"]`).forEach(d => d.classList.remove('on')); }
  }
  else if (t.id === 's_q') {
    const q = t.value.trim().toLowerCase();
    const res = q ? S.events.filter(e => (e.title + ' ' + (e.note||'')).toLowerCase().includes(q)).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 30) : [];
    $('#s_res').innerHTML = !q ? '<p class="empty">Начните вводить текст</p>' : res.length ? res.map(e => `<div class="ev"><span class="bar" style="background:${cat(e.cat).color}"></span><button class="evb" data-act="gores" data-id="${e.id}"><b>${esc(e.title)}</b><small>${fmtLong(e.date)}${e.time ? ' · ' + timeRange(e) : ''}</small></button></div>`).join('') : '<p class="empty">Ничего не найдено</p>';
  }
  else if (t.id === 'f_rem_on') { $('#rem_opts').style.display = t.checked ? 'block' : 'none'; }
  else if (t.id === 'f_rem_rep') { $('#rem_days').style.display = t.value === 'custom' ? 'flex' : 'none'; }
});

// ---- Перетаскивание и растягивание событий в неделе ----
const fmtMin = m => m >= 1440 ? '23:59' : String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const snap15 = m => Math.round(m / 15) * 15;
const pointerMin = (col, y) => START_H*60 + (y - col.getBoundingClientRect().top) / ROWH * 60;
let drag = null, lastDragEnd = 0;
document.addEventListener('pointerdown', e => {
  const blk = e.target.closest('.wg-block'); if (!blk || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const item = S.events.find(x => x.id === blk.dataset.id); if (!item) return;
  const m = timeMin(item.time), m2 = timeMin(item.time2); if (m == null) return;
  const hadEnd = m2 != null && m2 > m, end = hadEnd ? m2 : m + 60;
  const mode = e.target.closest('.wg-rs') ? 'resize' : 'move';
  drag = { id:item.id, blk, col:blk.parentElement, mode, start:m, end, dur:end - m, hadEnd,
    off: pointerMin(blk.parentElement, e.clientY) - (mode === 'move' ? m : end),
    x0:e.clientX, y0:e.clientY, lastX:e.clientX, lastY:e.clientY, pid:e.pointerId,
    touch: e.pointerType !== 'mouse', active:false, newStart:m, newEnd:end };
  if (drag.touch) drag.timer = setTimeout(startDrag, 320);   // на телефоне — долгое нажатие
});
function startDrag() {
  if (!drag || drag.active) return;
  drag.active = true; drag.blk.classList.add('dragging'); document.body.classList.add('dragmode');
  if (navigator.vibrate) navigator.vibrate(10);
  requestAnimationFrame(autoScrollDrag);
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  if (!drag.active) {
    const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
    if (drag.touch) { if (dist > 10) { clearTimeout(drag.timer); drag = null; } return; }
    if (dist < 5) return;
    startDrag();
  }
  updateDrag();
});
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive:false });
function updateDrag() {
  if (drag.mode === 'move') {
    const target = [...document.querySelectorAll('.wg-col')].find(c => { const r = c.getBoundingClientRect(); return drag.lastX >= r.left && drag.lastX < r.right; });
    if (target && target !== drag.col) { target.appendChild(drag.blk); drag.col = target; }
    const s0 = Math.max(START_H*60, Math.min(1440 - Math.min(drag.dur, 60), snap15(pointerMin(drag.col, drag.lastY) - drag.off)));
    drag.newStart = s0; drag.newEnd = Math.min(1440, s0 + drag.dur);
  } else {
    drag.newEnd = Math.max(drag.start + 15, Math.min(1440, snap15(pointerMin(drag.col, drag.lastY) - drag.off)));
  }
  drag.blk.style.top = ((drag.newStart - START_H*60) / 60 * ROWH) + 'px';
  drag.blk.style.height = Math.max(22, (drag.newEnd - drag.newStart) / 60 * ROWH - 3) + 'px';
  const b = drag.blk.querySelector('b');
  if (b) b.textContent = (drag.mode === 'resize' || drag.hadEnd) ? fmtMin(drag.newStart) + '–' + fmtMin(drag.newEnd) : fmtMin(drag.newStart);
}
function autoScrollDrag() {
  if (!drag || !drag.active) return;
  const w = document.querySelector('.wgwrap');
  if (w) {
    const r = w.getBoundingClientRect(), head = (w.querySelector('.wg-stickytop') || {}).offsetHeight || 0;
    let dy = 0;
    if (drag.lastY < r.top + head + 36) dy = -10; else if (drag.lastY > r.bottom - 36) dy = 10;
    if (dy) { w.scrollTop += dy; updateDrag(); }
  }
  requestAnimationFrame(autoScrollDrag);
}
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.pid) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  document.body.classList.remove('dragmode');
  if (!d.active) return;                       // это был обычный клик — откроется карточка
  lastDragEnd = Date.now();
  if (!cancelled) {
    const item = S.events.find(x => x.id === d.id);
    if (item) { item.date = d.col.dataset.d; item.time = fmtMin(d.newStart); if (d.mode === 'resize' || d.hadEnd) item.time2 = fmtMin(d.newEnd); sel = item.date; save(); }
  }
  render();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

// ---- Клавиатура: Esc закрывает окна, Enter создаёт задачу ----
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (drag) { const d = drag; drag = null; clearTimeout(d.timer); document.body.classList.remove('dragmode'); if (d.active) { lastDragEnd = Date.now(); render(); } return; }
    if ($('#qc').classList.contains('show')) { e.preventDefault(); closeQuick(); return; }
    if ($('#ov').classList.contains('show')) { e.preventDefault(); if (delAsk) { delAsk = null; openSettings(); return; } palOpen = null; closeSheet(); return; }
  }
  if (e.key === 'Enter' && !e.isComposing) {
    if (e.target.id === 'q_t') { e.preventDefault(); document.querySelector('[data-act="qsave"]').click(); }
    else if (e.target.id === 'ds_new') {
      const title = e.target.value.trim(); if (!title) return;
      S.events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), done:false, title, date: sel, time:'', time2:'', cat: S.cats[0] && S.cats[0].id, note:'', reminder:{enabled:false, offset:15, repeat:'none', days:[]} });
      save(); render(); const i = $('#ds_new'); if (i) i.focus();
    }
  }
});

// ---- Свайп между периодами ----
let tsx = 0, tsy = 0;
document.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!e.changedTouches || $('#ov').classList.contains('show') || drag || Date.now() - lastDragEnd < 600) return;
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
}, {passive:true});

// ---- Уведомления ----
const plog = t => { const l = $('#plog'); if (l) l.textContent += (l.textContent ? '\n' : '') + t; };
const b64 = v => { const raw = atob((v + '='.repeat((4 - v.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); };
async function enablePush() {
  try {
    if (navigator.standalone !== true) return plog('Откройте приложение с экрана «Домой», а не из Safari.');
    if (!('PushManager' in window)) return plog('Уведомления не поддерживаются.');
    const reg = await navigator.serviceWorker.ready;
    if (await Notification.requestPermission() !== 'granted') return plog('Разрешение на уведомления не выдано.');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const r = await fetch(SUPABASE_URL + '/rest/v1/push_subscriptions', { method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth }) });
    plog(r.ok || r.status === 409 ? 'Уведомления включены.' : 'Ошибка сохранения: ' + r.status);
  } catch (e) { plog('Ошибка: ' + e.message); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
