<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parsimony">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@300;400&family=Great+Vibes&display=swap" rel="stylesheet">
<title>Parsimony</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/ui2.css">
</head>
<body class="ui2">
<div class="app">
  <aside id="side"></aside>
  <div class="content">
    <header>
      <div class="top">
        <button class="ic chev m-only" data-act="prev" aria-label="Назад"></button>
        <h1 id="ttl"></h1>
        <button class="ic chev m-only" data-act="next" aria-label="Вперёд"></button>
        <div class="navg d-only"><button class="ic" data-act="prev" aria-label="Назад" title="Назад (←)"></button><button class="pill" data-act="today" title="Сегодня (T)">Сегодня</button><button class="ic" data-act="next" aria-label="Вперёд" title="Вперёд (→)"></button></div>
        <div class="segc d-only"><button data-act="v" data-v="month" title="Месяц (M)">Месяц</button><button data-act="v" data-v="week" title="Неделя (W)">Неделя</button><button data-act="v" data-v="day" title="День (D)">День</button><button data-act="v" data-v="list" title="Список (L)">Список</button></div>
        <button class="btn-new m-only" data-act="add"></button>
        <button class="ic m-only" data-act="settings" aria-label="Настройки" title="Настройки"></button>
        <button class="ic hdr-ava" data-act="sec" data-s="profile" aria-label="Профиль" title="Профиль"></button>
      </div>
      <div class="bar2 m-only">
        <div class="segc"><button data-act="v" data-v="month">Месяц</button><button data-act="v" data-v="week">Неделя</button><button data-act="v" data-v="day">День</button><button data-act="v" data-v="list">Список</button></div>
        <div id="secinfo" class="secinfo"></div>
        <button class="pill" data-act="today">Сегодня</button>
        <button class="ic" data-act="search" aria-label="Поиск" style="width:36px"></button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav id="tabbar" class="m-only" aria-label="Разделы"></nav>
<div id="ov"><div id="sh"></div></div>
<div id="qc" class="qc"></div>
<div id="cmd"><div class="cmd-box"><div class="cmd-in"><span id="cmd_ic"></span><input id="cmd_q" type="text" placeholder="Найти событие, команду или написать «встреча завтра в 15»" autocomplete="off"></div><div id="cmd_res"></div><div class="cmd-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> выбрать</span><span><kbd>Enter</kbd> выполнить</span><span><kbd>Esc</kbd> закрыть</span></div></div></div>
<div id="toast"></div>
<input id="imp_file" type="file" accept="application/json,.json" hidden>

<script src="js/core.js"></script>
<script src="js/look.js"></script>
<script src="js/help.js"></script>
<script src="js/calendar.js"></script>
<script src="js/charts.js"></script>
<script src="js/sections.js"></script>
<script src="js/tasks.js"></script>
<script src="js/habits.js"></script>
<script src="js/finance.js"></script>
<script src="js/goals.js"></script>
<script src="js/pages.js"></script>
<script src="js/timer.js"></script>
<script src="js/ui2.js"></script>
<script src="js/layout.js"></script>
<script src="js/tour.js"></script>
<script src="js/input.js"></script>
<script src="js/share.js"></script>
<script src="js/notify.js"></script>
<script src="js/main.js"></script>
</body>
</html>
