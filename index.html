<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Напоминалка">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Напоминалка</title>
<style>
/* ---- Дизайн-токены: цвета тем, отступы (шаг 4/8), радиусы, тени ---- */
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--sf:#ffffff;--tx:#1d1d1c;--tx2:#5f5e5b;--mut:#9b9a97;
  --line:#e9e9e7;--grid:#efefed;--hov:rgba(55,53,47,.06);--hov2:rgba(55,53,47,.1);
  --acc:#2b2b2b;--accfg:#ffffff;--red:#e5484d;--dng:#d93a3a;--ok:#2f9e5b;--wk:rgba(55,53,47,.025);
  --mix:17%;--mixtx:62%;--hovf:brightness(.97);
  --sh1:0 1px 2px rgba(15,15,15,.06),0 0 0 1px rgba(15,15,15,.05);
  --sh2:0 14px 36px rgba(15,15,15,.16),0 0 0 1px rgba(15,15,15,.07);
  --r1:6px;--r2:10px;--r3:14px;--gut:54px;--hh:60px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#191919;--bg2:#202020;--sf:#252525;--tx:#ececec;--tx2:#b4b4b4;--mut:#7f7f7f;
  --line:#2f2f2f;--grid:#292929;--hov:rgba(255,255,255,.055);--hov2:rgba(255,255,255,.09);
  --acc:#e08a3c;--accfg:#1a0f02;--dng:#f06a6a;--wk:rgba(255,255,255,.018);
  --mix:26%;--mixtx:52%;--hovf:brightness(1.12);
  --sh1:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);
  --sh2:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#191919;--bg2:#202020;--sf:#252525;--tx:#ececec;--tx2:#b4b4b4;--mut:#7f7f7f;
  --line:#2f2f2f;--grid:#292929;--hov:rgba(255,255,255,.055);--hov2:rgba(255,255,255,.09);
  --acc:#e08a3c;--accfg:#1a0f02;--dng:#f06a6a;--wk:rgba(255,255,255,.018);
  --mix:26%;--mixtx:52%;--hovf:brightness(1.12);
  --sh1:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);
  --sh2:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);color-scheme:dark}
:root[data-theme=black]{
  --bg:#000000;--bg2:#0a0a0a;--sf:#141414;--tx:#f2f2f2;--tx2:#b0b0b0;--mut:#767676;
  --line:#232323;--grid:#1b1b1b;--hov:rgba(255,255,255,.06);--hov2:rgba(255,255,255,.1);
  --acc:#e6e6e6;--accfg:#111111;--dng:#f06a6a;--wk:rgba(255,255,255,.02);
  --mix:24%;--mixtx:50%;--hovf:brightness(1.15);
  --sh1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);
  --sh2:0 16px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.4;background:var(--bg);color:var(--tx);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:1px}
kbd{font-family:var(--font);font-size:11px;font-weight:500;color:var(--mut);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:16px;display:inline-block;min-width:18px;text-align:center;background:var(--bg)}
.app{display:block}
.content{min-width:0}
#side{display:none}
.d-only{display:none!important}

/* ---- Шапка ---- */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px);padding:calc(6px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:4px;min-height:44px}
#ttl{flex:1;min-width:0;margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl .sub{font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0;margin-left:8px}
.ic{width:40px;height:44px;border-radius:var(--r2);display:grid;place-items:center;color:var(--tx2);flex:none;transition:background .12s,color .12s}
.ic.chev{width:34px}
.btn-new{height:36px;padding:0 14px 0 11px;border-radius:999px;background:var(--acc);color:var(--accfg);font-weight:600;font-size:14px;flex:none;display:inline-flex;align-items:center;gap:5px;transition:transform .12s,filter .12s}
.btn-new:active{transform:scale(.97)}
.bar2{display:flex;gap:6px;margin-top:6px;align-items:center}
.segc{flex:1;display:flex;background:var(--hov);border-radius:10px;padding:2px;gap:2px}
.segc button{flex:1;height:32px;border-radius:8px;font-size:13px;font-weight:500;color:var(--tx2);transition:background .15s,color .15s,box-shadow .15s;white-space:nowrap}
.segc button.on{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:var(--sh1)}
.pill{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;flex:none;background:var(--bg);display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.pill.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
@media(hover:hover){
  .ic:hover,.pill:hover{background:var(--hov);color:var(--tx)}
  .segc button:not(.on):hover{color:var(--tx)}
  .btn-new:hover{filter:brightness(1.08)}
}

main{padding:10px 12px 28px}
main.anim-l>*{animation:inL .16s ease-out}
main.anim-r>*{animation:inR .16s ease-out}
main.anim-f>*{animation:fadeIn .14s ease-out}
@keyframes inL{from{opacity:.25;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:.25;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes sheetLeft{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Сетка недели / дня ---- */
.wgwrap{overflow:auto;height:calc(100vh - var(--hh) - 20px);height:calc(100dvh - var(--hh) - 20px);position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:var(--r2)}
.wg-stickytop{position:sticky;top:0;z-index:5;background:var(--bg)}
.wg-head,.wg-alldays{display:grid;grid-template-columns:var(--gut) repeat(var(--n,7),minmax(0,1fr))}
.wg-corner{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 4px;font-size:10px;color:var(--mut)}
.wg-day{padding:4px 2px 6px;text-align:center;min-width:0}
.wg-dow{display:block;font-size:11px;color:var(--mut);font-weight:500}
.wg-num{margin-top:2px;width:30px;height:30px;border-radius:50%;font-size:16px;font-weight:600;color:var(--tx);transition:background .12s}
.wg-num.today{background:var(--red);color:#fff}
.wg-num.sel{box-shadow:inset 0 0 0 1.5px var(--acc)}
.wg-day.wknd .wg-dow{color:color-mix(in srgb,var(--red) 55%,var(--mut))}
.wg-alldays{border-bottom:1px solid var(--line)}
.wg-alldays .wg-corner{font-size:10px;align-items:center}
.wg-allcol{border-left:1px solid var(--grid);padding:3px 2px;display:flex;flex-direction:column;gap:2px;min-height:28px;min-width:0;cursor:pointer}
.wg-allcol.wknd{background:var(--wk)}
.wg-chip{text-align:left;border-radius:5px;padding:2px 6px;font-size:11.5px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) var(--mix),var(--bg));color:color-mix(in srgb,var(--c) var(--mixtx),var(--tx));transition:filter .12s}
.wg-chip.done{text-decoration:line-through;opacity:.6}
.wg-body{display:flex;padding-top:10px}
.wg-hours{width:var(--gut);flex:none;position:relative}
.wg-hourrow{height:var(--rh);position:relative}
.wg-hourrow span{position:absolute;top:-7px;right:8px;font-size:10.5px;color:var(--mut);font-weight:500}
.wg-hourrow span.hide{visibility:hidden}
.wg-nowlabel{position:absolute;right:4px;transform:translateY(-50%);background:var(--red);color:#fff;font-weight:600;font-size:10.5px;padding:1px 5px;border-radius:5px;z-index:3}
.wg-cols{position:relative;display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));flex:1;min-width:0}
.wg-col{position:relative;border-left:1px solid var(--grid);background-image:repeating-linear-gradient(to bottom,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent var(--rh));min-width:0}
.wg-col.wknd{background-color:var(--wk)}
.wg-block{position:absolute;border-radius:var(--r1);padding:3px 6px 3px 8px;overflow:hidden;text-align:left;display:flex;flex-direction:column;align-items:stretch;background:color-mix(in srgb,var(--c) var(--mix),var(--bg));color:color-mix(in srgb,var(--c) var(--mixtx),var(--tx));font-size:12px;line-height:1.3;box-shadow:inset 3px 0 0 var(--c),0 0 0 1px var(--bg);cursor:grab;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:filter .12s,box-shadow .12s}
.wb-t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:normal;word-break:normal}
.wb-m{font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.wb-rep{position:absolute;right:5px;top:3px;font-style:normal;font-size:10px;opacity:.7}
.wg-block.short{flex-direction:row;align-items:center;gap:6px;padding-top:0;padding-bottom:0}
.wg-block.short .wb-t{-webkit-line-clamp:1;flex:none;max-width:70%}
.wg-block.past{opacity:.55}
.wg-block.done .wb-t{text-decoration:line-through}
.wg-block.done{opacity:.5}
.wg-rs{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize}
.wg-rs::after{content:'';position:absolute;left:50%;bottom:3px;width:20px;height:3px;margin-left:-10px;border-radius:2px;background:currentColor;opacity:0;transition:opacity .12s}
.wg-block.dragging{z-index:6;cursor:grabbing;box-shadow:inset 3px 0 0 var(--c),0 10px 24px rgba(0,0,0,.25);opacity:.96;left:1px!important;width:calc(100% - 3px)!important}
body.dragmode{-webkit-user-select:none;user-select:none;cursor:grabbing}
.wg-ghost{position:absolute;left:2px;right:3px;border-radius:var(--r1);background:color-mix(in srgb,var(--acc) 12%,transparent);border:1.5px dashed color-mix(in srgb,var(--acc) 60%,transparent);pointer-events:none;font-size:11px;font-weight:600;padding:2px 6px;color:var(--tx);z-index:4}
.wg-now{position:absolute;left:-1px;right:0;height:2px;margin-top:-1px;background:var(--red);z-index:3;pointer-events:none}
.wg-now::before{content:'';position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
@media(hover:hover){
  .wg-block:hover,.wg-chip:hover{filter:var(--hovf)}
  .wg-block:hover .wg-rs::after{opacity:.4}
  .wg-allcol:hover{background:var(--hov)}
  .wg-num:not(.today):hover{background:var(--hov)}
}

/* ---- Вид «День» ---- */
.dayview{display:flex;flex-direction:column;gap:12px}
.daygrid{min-width:0}
.dayview .wgwrap{height:58vh}
.wgwrap.one .wg-day{text-align:left;padding-left:10px;display:flex;align-items:center;gap:8px}
.wgwrap.one .wg-dow{font-size:13px}
.dayside{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r3);padding:16px}
.ds-head b{display:block;font-size:20px;letter-spacing:-.02em}
.ds-head small{color:var(--mut);font-size:13px}
.ds-prog{margin:14px 0 12px}
.ds-bar{height:6px;border-radius:3px;background:var(--hov2);overflow:hidden}
.ds-bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.ds-prog span{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--mut)}
.nextcard{display:block;width:100%;text-align:left;border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;background:color-mix(in srgb,var(--c) var(--mix),var(--bg));box-shadow:inset 3px 0 0 var(--c);transition:filter .12s}
.nextcard small{display:block;font-size:11px;font-weight:600;color:color-mix(in srgb,var(--c) var(--mixtx),var(--tx));text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.nextcard b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextcard span{font-size:12px;color:var(--tx2)}
.ds-new{width:100%;height:40px;padding:0 12px;border:1px dashed var(--line);border-radius:var(--r2);background:var(--bg);font-size:14px}
.ds-new:focus{outline:0;border-style:solid;border-color:var(--acc)}
.ds-sec{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.nlhint{font-size:12px;color:var(--tx2);min-height:0;margin:6px 2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nlhint:empty{display:none}
.nlhint b{font-weight:600;color:var(--tx);background:var(--hov);padding:1px 7px;border-radius:999px}
.nlhint button{font-size:12px;color:var(--mut);text-decoration:underline}

/* ---- Список событий ---- */
.ev{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-radius:var(--r2);transition:background .12s}
.chk{width:20px;height:20px;margin-top:1px;border:1.5px solid color-mix(in srgb,var(--c,var(--mut)) 70%,var(--line));border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;transition:background .15s,border-color .15s,transform .1s}
.chk:active{transform:scale(.9)}
.done .chk{background:var(--c,var(--acc));border-color:var(--c,var(--acc))}
.evb{flex:1;min-width:0;text-align:left}
.evb b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.evb small{color:var(--mut);font-size:12.5px}
.evb p{margin:3px 0 0;font-size:13px;color:var(--tx2);white-space:pre-wrap}
.done .evb b{text-decoration:line-through;color:var(--mut)}
.empty{color:var(--mut);font-size:13.5px;margin:6px 0 0}
@media(hover:hover){.ev:hover{background:var(--hov)}}

/* ---- Месяц ---- */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mdw{text-align:center;font-size:11px;color:var(--mut);font-weight:500;padding:2px 0 4px}
.mc{min-width:0;aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:6px 0 4px;cursor:pointer;transition:background .12s}
.mc-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500}
.mc.oth .mc-n{color:var(--mut);opacity:.6}
.mc.wknd:not(.oth) .mc-n{color:color-mix(in srgb,var(--red) 60%,var(--tx))}
.mc.today .mc-n{background:var(--red);color:#fff!important;font-weight:700}
.mc.sel{background:var(--hov2)}
.mdots{display:flex;gap:3px;height:6px}
.mdots u{width:6px;height:6px;border-radius:50%}
.mchips{display:none}
.mpanel{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r3);padding:14px 12px}
.mp-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 6px}
.mp-head b{font-size:16px;letter-spacing:-.01em}

/* ---- Список (agenda) ---- */
.agenda{max-width:780px;margin:0 auto}
.ag-day{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.ag-day:last-child{border-bottom:0}
.ag-date{width:54px;flex:none;cursor:pointer}
.ag-date b{display:block;font-size:24px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ag-date small{color:var(--mut);font-size:12px;font-weight:500}
.ag-date.today b,.ag-date.today small{color:var(--red)}
.ag-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ag-row{display:flex;align-items:center;gap:10px;border-radius:8px;padding:5px 6px;transition:background .12s}
.ag-row .chk{margin-top:0}
.ag-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.ag-time{width:86px;flex:none;font-size:12.5px;color:var(--tx2);font-weight:500}
.ag-bar{width:3px;height:30px;border-radius:2px;background:var(--c);flex:none}
.ag-txt{min-width:0}
.ag-txt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-txt small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-row.done .ag-txt b{text-decoration:line-through;color:var(--mut)}
.ag-empty{text-align:center;color:var(--mut);padding:60px 20px}
.ag-empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
@media(hover:hover){.ag-row:hover{background:var(--hov)}}

/* ---- Окна: карточка события, настройки (снизу на телефоне, справа на ПК) ---- */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:30}
#ov.show{display:flex;animation:fadeIn .15s}
#sh{position:relative;width:100%;max-width:520px;max-height:92%;max-height:92dvh;overflow:auto;background:var(--sf);border-radius:18px 18px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:sheetUp .2s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.grab{display:block;width:38px;height:5px;border-radius:3px;background:var(--hov2);margin:2px auto 8px}
.sh-head{display:flex;align-items:center;gap:4px;margin:0 -8px 4px}
.sh-head h3{flex:1;margin:0 8px;font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.sh-head .ic{height:36px;width:36px}
.f-title{width:100%;border:0;background:none;font-size:22px;font-weight:700;letter-spacing:-.02em;padding:2px 0 6px;outline:0;color:var(--tx)}
.f-title::placeholder{color:var(--mut);opacity:.7}
.f-rec{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.frow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow>.fl{font-size:13px;color:var(--mut);padding-top:9px;font-weight:500;display:flex;align-items:center;gap:6px}
.fin{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);transition:border-color .12s,box-shadow .12s}
.fin:focus{outline:0;border-color:color-mix(in srgb,var(--acc) 70%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
textarea.fin{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.45}
select.fin{padding-right:6px}
.ftime{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ftime .fin{width:auto;flex:1;min-width:92px}
.dash{color:var(--mut)}
.swl{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer;margin-top:8px;-webkit-user-select:none;user-select:none}
.sw{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--hov2);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--acc)}
.sw:checked::after{transform:translateX(14px)}
:root[data-theme=black] .sw:checked::after{background:#111}
.ccats{display:flex;flex-wrap:wrap;gap:6px}
.ccat{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;transition:background .12s,border-color .12s}
.ccat i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.ccat.on{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) var(--mix),var(--bg));color:color-mix(in srgb,var(--c) var(--mixtx),var(--tx));font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{min-width:36px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.until{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--tx2)}
.until .fin{flex:1}
.sh-foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r2);font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,filter .12s}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.btn.grow{flex:1}
.btn.dng{color:var(--dng)}
.btn.dngf{background:var(--dng);border-color:var(--dng);color:#fff;font-weight:600}
@media(hover:hover){.btn:not(.pri):not(.dngf):hover{background:var(--hov)}.btn.pri:hover,.btn.dngf:hover{filter:brightness(1.08)}.ccat:not(.on):hover,.chip:not(.on):hover{background:var(--hov)}}
.ask{margin-top:12px;padding:12px;border-radius:var(--r2);background:color-mix(in srgb,var(--dng) 9%,var(--sf));font-size:13.5px}
.ask b{display:block;margin-bottom:8px}
.ask .row{display:flex;gap:6px;flex-wrap:wrap}

/* Настройки */
.set-sec{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:20px 0 8px}
.set-sec:first-of-type{margin-top:6px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.set-row:first-of-type{border-top:0}
.set-row .fin{width:auto;min-width:150px}
.thm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thm button{border:1.5px solid var(--line);border-radius:var(--r2);padding:6px 6px 7px;font-size:12px;font-weight:500;transition:border-color .12s}
.thm button.on{border-color:var(--acc);font-weight:600}
.thm .pv{display:block;height:40px;border-radius:7px;margin-bottom:6px;position:relative;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.thm .pv::after{content:'';position:absolute;left:8px;right:8px;top:9px;height:6px;border-radius:3px;background:var(--pa)}
.thm .pv::before{content:'';position:absolute;left:8px;width:55%;top:20px;height:12px;border-radius:3px;background:var(--pb)}
.seg2{display:flex;background:var(--hov);border-radius:9px;padding:2px;gap:2px}
.seg2 button{height:30px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--tx2)}
.seg2 button.on{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:var(--sh1)}
.nstat{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:10px}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.ndot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.ndot.warn{background:#e5a50a}
.ndot.off{background:var(--red)}
.set-note{font-size:12.5px;color:var(--mut);margin:8px 0 0}
#plog{font-size:13px;color:var(--tx2);white-space:pre-wrap;margin:8px 0 0}
#plog:empty{display:none}
.catlist{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;margin-bottom:8px;background:var(--bg)}
.catedit{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border-top:1px solid var(--line)}
.catlist>.catedit:first-child{border-top:0}
.cswatch{width:24px;height:24px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px color-mix(in srgb,var(--c) 50%,transparent)}
.cname{flex:1;min-width:0;border:0;background:transparent;padding:9px 2px;font-size:15px}
.cname:focus{outline:0;box-shadow:inset 0 -2px 0 var(--acc)}
.cdel{width:36px;height:36px;border-radius:9px;color:var(--mut);display:grid;place-items:center;flex:none}
.cdel:hover{background:var(--hov);color:var(--dng)}
.cdel:disabled{opacity:.3;cursor:not-allowed;background:none;color:var(--mut)}
.catedit.ask2{background:color-mix(in srgb,var(--dng) 9%,var(--bg))}
.askt{flex:1;min-width:0;font-size:14px;font-weight:600;padding:8px 0;line-height:1.3;overflow-wrap:anywhere}
.askyes{border-radius:8px;padding:7px 10px;flex:none;background:var(--dng);color:#fff;font-weight:600;font-size:13px}
.askno{border:1px solid var(--line);border-radius:8px;padding:7px 10px;flex:none;font-size:13px}
.cpal{display:flex;flex-wrap:wrap;gap:10px;padding:4px 12px 12px 46px}
.cdot{display:block;width:24px;height:24px;border-radius:50%;background:var(--c);position:relative;transition:transform .1s}
.cdot:hover{transform:scale(1.12)}
.cdot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.cdot.custom{background:conic-gradient(#ef4444,#eab308,#22c55e,#38bdf8,#6366f1,#ec4899,#ef4444);overflow:hidden;cursor:pointer}
.cdot.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.addcat{width:100%;height:40px;border:1px dashed var(--line);border-radius:var(--r2);color:var(--mut);font-size:13.5px}
.addcat:hover{color:var(--tx);border-color:var(--mut)}
.help{width:100%;border-collapse:collapse;font-size:14px}
.help td{padding:8px 0;border-top:1px solid var(--line)}
.help td:last-child{text-align:right;white-space:nowrap}
.help tr:first-child td{border-top:0}

/* ---- Быстрое создание ---- */
.qc{position:fixed;z-index:25;display:none;background:var(--sf);border-radius:var(--r3);box-shadow:var(--sh2);padding:12px;width:310px}
.qc.show{display:block;animation:popIn .14s ease-out}
.qhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px 2px}

.qx:hover{background:var(--hov)}

.qrow{display:flex;gap:6px;align-items:center;margin:8px 0}

.qc .ccats{margin:2px 0 10px}
.qbtns{display:flex;gap:6px}
.qbtns .btn{flex:1;height:36px;font-size:13.5px}

/* ---- Командное меню (Ctrl+K) ---- */
#cmd{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);display:none;justify-content:center;align-items:flex-start;padding:12vh 12px 12px}

#cmd_res{max-height:52vh;overflow-y:auto;padding:6px}
.cmd-sec{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}

.cmd-it .ci{width:22px;display:grid;place-items:center;color:var(--tx2);flex:none}
.cmd-it .cd{width:9px;height:9px;border-radius:50%;background:var(--c);margin:0 6px}
.cmd-it .cl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-it .cs{color:var(--mut);font-size:12.5px;flex:none}
.cmd-it.act{background:var(--hov2)}
.cmd-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}

/* ---- Уведомление внизу (тост) с «Отменить» ---- */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:50;background:var(--tx);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 24px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{font-weight:700;color:var(--bg);opacity:.9;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

}

// ---- Ввод фразой: «встреча завтра в 15:30 на час #работа» ----
const MON_RE = 'январ[яь]|феврал[яь]|марта?|апрел[яь]|ма[яй]|июн[яь]|июл[яь]|августа?|сентябр[яь]|октябр[яь]|ноябр[яь]|декабр[яь]';
function parseNL(src, base) {
  const today = todayK(), now = new Date();
  let s = ' ' + String(src) + ' ', date = null, time = null, time2 = null, dur = null, catId = null;
  const R = body => new RegExp('(^|[\\s,;(])' + body + '(?=$|[\\s,;.!?)])', 'i');
  const cut = (re, fn) => { const m = s.match(re); if (!m || fn(m) === false) return false; s = s.slice(0, m.index) + m[1] + ' ' + s.slice(m.index + m[0].length); return true; };
  const hm = (h, mi) => String(h).padStart(2,'0') + ':' + String(mi||0).padStart(2,'0');
  const tm = (h, mi, mod) => { h = Number(h); mi = Number(mi || 0); if (h > 23 || mi > 59) return null;
    mod = (mod || '').toLowerCase(); if ((mod === 'вечера' || mod === 'дня') && h < 12) h += 12; if (mod === 'ночи' && h === 12) h = 0; if (mod === 'утра' && h === 12) h = 0;
    return hm(h, mi); };
  const T = '(\\d{1,2})(?:[:.](\\d{2}))?';
  cut(/(^|\s)#([^\s#]+)(?=$|\s)/, m => { const q = m[2].toLowerCase(); const c = S.cats.find(c => c.name.toLowerCase().startsWith(q)); if (!c) return false; catId = c.id; });
  cut(R('через\\s+(полчаса|час|(\\d+)\\s*(минут[уы]?|мин|час(?:а|ов)?|ч))'), m => {
    const w = m[2].toLowerCase(), add = w === 'полчаса' ? 30 : w === 'час' ? 60 : /^ч/i.test(m[4]) ? Number(m[3]) * 60 : Number(m[3]);
    const t = new Date(now.getTime() + add * 60000); t.setMinutes(Math.ceil(t.getMinutes() / 5) * 5, 0, 0);
    date = ds(t); time = hm(t.getHours(), t.getMinutes()); });
  if (!date) cut(R('через\\s+(неделю|(\\d+)\\s*(дн(?:я|ей)|день|недел[иья]))'), m => {

  if (!date) cut(R('(сегодня|послезавтра|завтра)'), m => { const w = m[2].toLowerCase(); date = addDays(today, w === 'сегодня' ? 0 : w === 'завтра' ? 1 : 2); });
  if (!date) cut(R('(?:в|во)\\s+(следующ\\S*\\s+)?(понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье|пн|вт|ср|чт|пт|сб|вс)'), m => {
    const w = m[3].toLowerCase(), short = {пн:0,вт:1,ср:2,чт:3,пт:4,сб:5,вс:6};
    const idx = w in short ? short[w] : ['пон','вто','сре','чет','пят','суб','вос'].findIndex(p => w.startsWith(p));
    let diff = (idx - dowIdx(today) + 7) % 7; if (m[2]) diff += 7;
    date = addDays(today, diff); });
  cut(R('с\\s+' + T + '\\s+до\\s+' + T), m => { const a = tm(m[2], m[3]), b = tm(m[4], m[5]); if (!a || !b) return false; time = a; time2 = b; });
  if (!time) cut(R('(\\d{1,2})[:.](\\d{2})\\s*[-–—]\\s*(\\d{1,2})[:.](\\d{2})'), m => { const a = tm(m[2], m[3]), b = tm(m[4], m[5]); if (!a || !b) return false; time = a; time2 = b; });
  if (!time) cut(R('в\\s+полдень'), () => { time = '12:00'; });

  if (!date) cut(R('(\\d{1,2})\\s+(' + MON_RE + ')(?:\\s+(\\d{4}))?'), m => {

    if (mo < 0 || d < 1 || d > 31) return false;

  if (!date) cut(R('(\\d{1,2})\\.(\\d{1,2})(?:\\.(\\d{2,4}))?'), m => {
    const d = Number(m[2]), mo = Number(m[3]) - 1; if (d < 1 || d > 31 || mo < 0 || mo > 11) return false;

      + (es.length > lim ? `<button class="mmore" data-act="goday" data-d="${k}">ещё ${es.length - lim}</button>` : '') : '';
    const dots = es.slice(0,4).map(e => `<u style="background:${cat(e.cat).color}"></u>`).join('');
    return `<div class="mc${inMonth?'':' oth'}${k===today?' today':''}${k===sel?' sel':''}${isWknd(k)?' wknd':''}" data-act="pick" data-d="${k}"><span class="mc-n"${pc?` data-act="goday" data-d="${k}" title="Открыть день"`:''}>${c.getDate()}</span><span class="mdots">${dots}</span><div class="mchips">${chips}</div></div>`;
  }).join('');
  h += '</div>';
  if (!pc) h += `<div class="mpanel"><div class="mp-head"><b>${fmtLong(sel)}</b><button class="pill sm" data-act="addday">${I(IC.plus,14)} Добавить</button></div>${dayList(sel)}</div>`;
  return h;
}

function miniHTML() {

// Раскладка пересекающихся событий по колонкам
function layoutDay(list) {
  const items = list.map(e => { const s = timeMin(e.time), t2 = timeMin(e.time2); return { e, s, end: t2 != null && t2 > s ? t2 : s + 60 }; })
    .sort((a, b) => a.s - b.s || b.end - a.end);
  let group = [], groupEnd = -1;
  const flush = () => { const ends = []; group.forEach(it => { let c = ends.findIndex(x => x <= it.s); if (c < 0) { c = ends.length; ends.push(0); } ends[c] = it.end; it.col = c; }); group.forEach(it => it.cols = ends.length); group = []; };
  items.forEach(it => { if (group.length && it.s >= groupEnd) { flush(); groupEnd = -1; } group.push(it); groupEnd = Math.max(groupEnd, it.end); });
  if (group.length) flush();
  return items;
}

function gridHTML(days) {
  const today = todayK(), SH = startH(), RH = rowH(), nm = nowMin();
  const showNow = days.includes(today) && nm >= SH*60, nowTop = (nm - SH*60) / 60 * RH;
  const head = days.map(k => `<div class="wg-day${isWknd(k)?' wknd':''}"><span class="wg-dow">${days.length === 1 ? DOWF[dowIdx(k)] : dowName(k)}</span><button class="wg-num${k===today?' today':''}${k===sel&&k!==today&&days.length>1?' sel':''}" data-act="goday" data-d="${k}" title="Открыть день">${pd(k).getDate()}</button></div>`).join('');
  const allrow = days.map(k => { const es = evOn(k).filter(e => !e.time);
    return `<div class="wg-allcol${isWknd(k)?' wknd':''}" data-act="quickadd" data-d="${k}" title="Добавить задачу на весь день">${es.map(e => `<button class="wg-chip${e.done?' done':''}" data-act="edit" data-id="${e.id}" data-d="${k}" style="--c:${cat(e.cat).color}">${e.done?'✓ ':''}${esc(e.title)}</button>`).join('')}</div>`; }).join('');
  const hours = [...Array(24 - SH)].map((_, i) => { const h = SH + i, hide = i === 0 || (showNow && Math.abs(nm - h*60) < 14);
    return `<div class="wg-hourrow"><span${hide?' class="hide"':''}>${String(h).padStart(2,'0')}:00</span></div>`; }).join('');
  const cols = days.map(k => {
    const blocks = layoutDay(evOn(k).filter(e => timeMin(e.time) != null)).map(it => {
      const e = it.e, top = Math.max(0, it.s - SH*60) / 60 * RH;
      const h = Math.max(20, (Math.max(it.end, SH*60 + 20) - Math.max(it.s, SH*60)) / 60 * RH - 2);
      const short = it.end - it.s <= 30 || h < 40, past = S.settings.dimPast && (k < today || (k === today && it.end <= nm)), w = 100 / it.cols;
      return `<button class="wg-block${e.done?' done':''}${past?' past':''}${short?' short':''}" data-act="edit" data-id="${e.id}" data-d="${k}" style="top:${top}px;height:${h}px;left:calc(${it.col*w}% + 1px);width:calc(${w}% - 3px);--c:${cat(e.cat).color}"><span class="wb-t">${e.done?'✓ ':''}${esc(e.title)}</span><span class="wb-m">${timeRange(e)}${e.loc?' · '+esc(e.loc):''}</span>${e.rec && !short ? '<i class="wb-rep">↻</i>' : ''}<span class="wg-rs" aria-hidden="true"></span></button>`;
    }).join('');
    return `<div class="wg-col${isWknd(k)?' wknd':''}" data-act="colclick" data-d="${k}" style="height:${(24-SH)*RH}px">${blocks}${showNow && k === today ? `<div class="wg-now" style="top:${nowTop}px"></div>` : ''}</div>`;
  }).join('');
  const wn = S.settings.weekNums && days.length > 1 ? `<span title="Номер недели">н${isoWeek(days[0])}</span>` : '';
  return `<div class="wgwrap${days.length===1?' one':''}" style="--n:${days.length};--rh:${RH}px"><div class="wg-stickytop"><div class="wg-head"><div class="wg-corner">${wn}</div>${head}</div>
  <div class="wg-alldays"><div class="wg-corner">весь день</div>${allrow}</div></div>
  <div class="wg-body"><div class="wg-hours">${hours}${showNow ? `<div class="wg-nowlabel" style="top:${nowTop}px">${fmtMin(nm)}</div>` : ''}</div><div class="wg-cols">${cols}</div></div></div>`;
}

// Ближайшее событие: «сейчас» или «дальше»
function nextUp(fromDay) {
  const t = todayK(), nm = nowMin();
  for (let i = 0; i < 2; i++) {
    const k = addDays(t, i);
    if (fromDay && k !== fromDay) continue;
    for (const e of evOn(k).filter(e => e.time && !e.done)) {
      const s = timeMin(e.time), en = timeMin(e.time2) != null && timeMin(e.time2) > s ? timeMin(e.time2) : s + 60;
      if (i === 0 && en <= nm) continue;
      return { e, k, label: i === 0 && s <= nm ? 'Сейчас · ещё ' + durText(en - nm) : i === 0 ? 'Через ' + durText(s - nm) : 'Завтра в ' + e.time };
    }
  }
  return null;
}
const nextCard = n => n ? `<button class="nextcard" data-act="edit" data-id="${n.e.id}" data-d="${n.k}" style="--c:${cat(n.e.cat).color}"><small>${n.label}</small><b>${esc(n.e.title)}</b><span>${timeRange(n.e)}${n.e.loc?' · '+esc(n.e.loc):''}</span></button>` : '';

function dayHTML() {

}

}

function titleHTML() {
  const pc = innerWidth >= 900;
  if (view === 'month') return `${MON[monthAnchor.getMonth()]} ${monthAnchor.getFullYear()}`;
  if (view === 'week') {
    const days = weekDays(), a = pd(days[0]), b = pd(days[days.length-1]);
    const wn = S.settings.weekNums ? `<span class="sub">неделя ${isoWeek(days[0])}</span>` : '';
    const MN = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    if (pc) return (a.getMonth() === b.getMonth() ? MON[a.getMonth()] : MN[a.getMonth()] + ' – ' + MN[b.getMonth()].toLowerCase()) + ' ' + b.getFullYear() + wn;
    return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MONS[b.getMonth()]}` : `${a.getDate()} ${MONS[a.getMonth()]} – ${b.getDate()} ${MONS[b.getMonth()]}`;

  const d = pd(sel); return `Список<span class="sub">с ${d.getDate()} ${MONG[d.getMonth()]}</span>`;
}

];
function cmdUpdate() {
  const q = $('#cmd_q').value.trim(), ql = q.toLowerCase(), items = [];
  if (q) {
    const p = parseNL(q, sel);
    if (p.title) items.push({ sec:'Создать', ic:IC.plus, t:`Создать «${p.title}»`, s: p.found ? p.desc : relDay(sel), run:() => quickCreate(p.title, p.date || sel, p.time || '', p.time2 || '', p.cat) });
    S.events.filter(e => (e.title + ' ' + (e.note||'') + ' ' + (e.loc||'')).toLowerCase().includes(ql))
      .map(e => ({ e, k: nextOcc(e) })).sort((a, b) => Math.abs(dayDiff(todayK(), a.k)) - Math.abs(dayDiff(todayK(), b.k))).slice(0, 12)
      .forEach(({ e, k }) => items.push({ sec:'События', c:cat(e.cat).color, t:e.title, s: relDay(k) + (e.time ? ', ' + e.time : '') + (isRec(e) ? ' ↻' : ''), run:() => { sel = k; syncMini(); monthAnchor = pd(k); monthAnchor.setDate(1); render(); openEvent(e.id, null, k); } }));
    COMMANDS().filter(c => c.t.toLowerCase().includes(ql)).forEach(c => items.push(Object.assign({ sec:'Команды' }, c)));
  } else {
    const up = []; for (let i = 0; i < 14 && up.length < 5; i++) { const k = addDays(todayK(), i); evOn(k).forEach(e => { if (up.length < 5 && !e.done && (i > 0 || !e.time || (timeMin(e.time2 || e.time) || 0) >= nowMin())) up.push({ e, k }); }); }
    up.forEach(({ e, k }) => items.push({ sec:'Ближайшие', c:cat(e.cat).color, t:e.title, s: relDay(k) + (e.time ? ', ' + e.time : ''), run:() => { sel = k; syncMini(); render(); openEvent(e.id, null, k); } }));
    COMMANDS().forEach(c => items.push(Object.assign({ sec:'Команды' }, c)));
  }
  cmdItems = items; cmdIdx = 0; cmdDraw();
}
function cmdDraw() {
  let h = '', last = '';
  cmdItems.forEach((it, i) => {
    if (it.sec !== last) { h += `<div class="cmd-sec">${it.sec}</div>`; last = it.sec; }
    h += `<button class="cmd-it${i===cmdIdx?' act':''}" data-act="cmdrun" data-i="${i}">${it.c ? `<span class="cd" style="--c:${it.c}"></span>` : `<span class="ci">${I(it.ic,17)}</span>`}<span class="cl">${esc(it.t)}</span>${it.s ? `<span class="cs">${esc(it.s)}</span>` : ''}${it.k ? `<kbd>${it.k}</kbd>` : ''}</button>`;
  });
  $('#cmd_res').innerHTML = h || '<p class="empty" style="padding:14px">Ничего не найдено</p>';
  const a = $('.cmd-it.act'); if (a) a.scrollIntoView({ block:'nearest' });
}
function cmdRun(i) { const it = cmdItems[i]; if (!it) return; closeCmd(); it.run(); }

function quickCreate(title, date, time, time2, catId) {
  if (!title) return;
  snap();
  if (time && time2 && timeMin(time2) <= timeMin(time)) time2 = '';
  S.events.push({ id:uid(), done:false, doneDates:[], skip:[], title, date, time, time2, cat:validCat(catId), note:'', loc:'', repeat:{type:'none'}, reminder:{enabled:false, offset:15, repeat:'none', days:[]} });
  sel = date; syncMini(); if (view === 'month') { monthAnchor = pd(date); monthAnchor.setDate(1); }
  save(); render();
  toast(`Создано: ${title} · ${relDay(date)}${time ? ', ' + time : ''}`, true);
}

// ---- Нажатия ----
document.addEventListener('click', async ev => {
  if (Date.now() - lastDragEnd < 250) return;
  const el = ev.target.closest('[data-act]');
  if (quickOpen() && !$('#qc').contains(ev.target) && !(el && (el.dataset.act === 'colclick' || el.dataset.act === 'quickadd'))) closeQuick();
  if (ev.target.id === 'ov') return closeSheet();
  if (ev.target.id === 'cmd') return closeCmd();
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'prev') move(-1); else if (a === 'next') move(1);
  else if (a === 'v') setView(el.dataset.v);
  else if (a === 'today') goToday();
  else if (a === 'mprev' || a === 'mnext') { miniAnchor.setDate(1); miniAnchor.setMonth(miniAnchor.getMonth() + (a === 'mnext' ? 1 : -1)); $('#side').innerHTML = sideHTML(); }
  else if (a === 'tpltoggle') { S.settings.tplOpen = S.settings.tplOpen === false; save(); render(); }
  else if (a === 'deltpl') { ev.stopPropagation(); snap(); S.templates = S.templates.filter(t => t.id !== id); save(); render(); toast('Шаблон удалён', true); }
  else if (a === 'usetpl') { const t = S.templates.find(x => x.id === id); if (t) openEvent(null, { title:t.title, cat:t.cat, time:t.time, time2:t.time2 }); }
  else if (a === 'savetpl') {
    const title = $('#f_t').value.trim(); if (!title) { $('#f_t').focus(); return; }
    const all = $('#f_all').checked;
    S.templates.push({ id:'t' + uid(), title: titleFromForm(title), cat:window._fe.cat, time: all ? '' : $('#f_tm').value, time2: all ? '' : $('#f_tm2').value });
    save(); el.innerHTML = I(IC.check,16) + ' В шаблонах'; el.disabled = true; $('#side').innerHTML = sideHTML(); toast('Шаблон сохранён');
  }
  else if (a === 'search') openCmd();
  else if (a === 'cmdrun') cmdRun(Number(el.dataset.i));
  else if (a === 'help') { closeCmd(); openHelp(); }
  else if (a === 'undo') { $('#toast').classList.remove('show'); undo(); }
  else if (a === 'pick') { const d = el.dataset.d; const fromMini = !!el.closest('#mini'); sel = d;
    if (view === 'month') { const m = pd(d); if (m.getMonth() !== monthAnchor.getMonth()) { monthAnchor = m; monthAnchor.setDate(1); } }
    if (fromMini) syncMini(); render(); }
  else if (a === 'goday') { sel = el.dataset.d; view = 'day'; syncMini(); render(2); }
  else if (a === 'addday') openEvent(null, { date: sel });
  else if (a === 'quickadd') { if (ev.target.closest('.wg-chip')) return; openQuick(el.dataset.d, '', ev.clientX, ev.clientY); }
  else if (a === 'colclick') {
    const rect = el.getBoundingClientRect();
    let mins = startH()*60 + Math.floor((ev.clientY - rect.top) / rowH() * 4) * 15;
    mins = Math.max(startH()*60, Math.min(23*60 + 45, mins));
    openQuick(el.dataset.d, fmtMin(mins), ev.clientX, ev.clientY);
  }
  else if (a === 'qclose') closeQuick();
  else if (a === 'qcat') { window._qc.cat = id; $$('#q_cats .ccat').forEach(b => b.classList.toggle('on', b.dataset.id === id)); }
  else if (a === 'qsave') {
    const raw = $('#q_t').value.trim(); if (!raw) { $('#q_t').focus(); return; }
    const q = window._qc, title = q.nl && q.nl.found && q.nl.title ? q.nl.title : raw, t1 = $('#q_tm').value, t2 = t1 ? $('#q_tm2').value : '';
    closeQuick(); quickCreate(title, q.date, t1, t2, q.cat);
  }
  else if (a === 'qfull') { const q = window._qc, raw = $('#q_t').value.trim();
    const preset = { title: q.nl && q.nl.found ? q.nl.title : raw, date:q.date, time:$('#q_tm').value, time2:$('#q_tm2').value, cat:q.cat };
    closeQuick(); sel = q.date; openEvent(null, preset); }
  else if (a === 'add') openEvent();
  else if (a === 'edit') openEvent(id, null, el.dataset.d);
  else if (a === 'toggle') toggleDone(id, el.dataset.d);
  else if (a === 'close') closeSheet();
  else if (a === 'settings') { palOpen = null; delAsk = null; openSettings(); }
  else if (a === 'catfilter') { hiddenCats.has(id) ? hiddenCats.delete(id) : hiddenCats.add(id); render(); }
  else if (a === 'fcat') { window._fe.cat = id; $$('#f_cats .ccat').forEach(b => b.classList.toggle('on', b.dataset.id === id)); }
  else if (a === 'repday') { const d = Number(el.dataset.d), s = window._fe.days; s.has(d) ? (s.size > 1 && s.delete(d)) : s.add(d); el.classList.toggle('on', s.has(d)); window._fe.daysTouched = true; }
  else if (a === 'save') saveEvent();
  else if (a === 'dup') {
    const src = S.events.find(x => x.id === window._fe.id); if (!src) return;
    snap(); const c = Object.assign(structuredClone(src), { id:uid(), title: src.title + ' (копия)', done:false, doneDates:[], skip:[] });
    S.events.push(c); save(); render(); openEvent(c.id, null, window._fe.inst); toast('Создана копия события', true);
  }
  else if (a === 'del') {
    const src = S.events.find(x => x.id === window._fe.id); if (!src) return;
    if (isRec(src)) { $('#f_ask').innerHTML = `<div class="ask"><b>Это повторяющееся событие. Что удалить?</b><div class="row"><button class="btn dng" data-act="delone">Только ${esc(fmtLong(window._fe.inst))}</button><button class="btn dngf" data-act="delall">Все повторения</button><button class="btn" data-act="delcancel">Отмена</button></div></div>`; $('#f_ask').scrollIntoView({ block:'nearest', behavior:'smooth' }); return; }
    snap(); S.events = S.events.filter(x => x.id !== src.id); save(); closeSheet(); render(); toast('Событие удалено', true);
  }
  else if (a === 'delone') { const src = S.events.find(x => x.id === window._fe.id); if (!src) return; snap(); src.skip = [...(src.skip||[]), window._fe.inst]; save(); closeSheet(); render(); toast('Удалено только это повторение', true); }
  else if (a === 'delall') { snap(); S.events = S.events.filter(x => x.id !== window._fe.id); save(); closeSheet(); render(); toast('Удалены все повторения', true); }
  else if (a === 'delcancel') $('#f_ask').innerHTML = '';
  else if (a === 'theme') { S.settings.theme = el.dataset.v; save(); render(); openSettings(true); }
  else if (a === 'density') { S.settings.density = el.dataset.v; save(); lastGridView = null; render(); openSettings(true); }
  else if (a === 'addcat') {
    const used = S.cats.map(c => c.color.toLowerCase()), nid = 'c' + uid();
    S.cats.push({ id:nid, name:'Новая категория', color: PALETTE.find(c => !used.includes(c)) || PALETTE[S.cats.length % PALETTE.length] });
    palOpen = null; save(); render(); openSettings(sheetOpen());
    setTimeout(() => { const i = $(`.cname[data-cat="${nid}"]`); if (i) { i.scrollIntoView({ block:'center' }); i.focus(); i.select(); } }, 60);
  }
  else if (a === 'catpal') { palOpen = palOpen === id ? null : id; openSettings(true); }
  else if (a === 'setcolor') { const c = S.cats.find(x => x.id === id); if (c) { c.color = el.dataset.c; save(); render(); openSettings(true); } }
  else if (a === 'delcat') { if (S.cats.length > 1) { delAsk = id; palOpen = null; openSettings(true); } }
  else if (a === 'delyes') {
    if (S.cats.length > 1) { snap(); S.cats = S.cats.filter(x => x.id !== id); hiddenCats.delete(id); }
    delAsk = null; if (palOpen === id) palOpen = null; save(); render(); openSettings(true); toast('Категория удалена', true);
  }
  else if (a === 'delno') { delAsk = null; openSettings(true); }
  else if (a === 'push') enablePush();
  else if (a === 'ntest') testNotif();
  else if (a === 'export') exportData();
  else if (a === 'import') $('#imp_file').click();

function toggleDone(id, k) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  if (isRec(e)) { const s = new Set(e.doneDates || []); s.has(k) ? s.delete(k) : s.add(k); e.doneDates = [...s]; }
  else e.done = !e.done;
  save(); render();
  const es = evOn(k); if (es.length > 1 && es.every(x => x.done)) toast(k === todayK() ? 'Все дела на сегодня сделаны 🎉' : 'Все дела этого дня сделаны 🎉');
}

function syncRepDays() {
  const fe = window._fe, d = $('#f_d') && $('#f_d').value; if (!fe || fe.daysTouched || !d) return;
  fe.days = new Set([dowIdx(d)]);

const titleFromForm = raw => { const f = window._fe; return !f.nlOff && f.nl && f.nl.found && f.nl.title ? f.nl.title : raw; };
function saveEvent() {
  const raw = $('#f_t').value.trim(); if (!raw) { $('#f_t').focus(); return; }
  const fe = window._fe, src = fe.id ? S.events.find(x => x.id === fe.id) : null;
  const all = $('#f_all').checked;
  let t1 = all ? '' : $('#f_tm').value, t2 = all || !t1 ? '' : $('#f_tm2').value;
  if (t1 && t2 && timeMin(t2) <= timeMin(t1)) t2 = fmtMin(Math.min(1439, timeMin(t1) + 60));
  const date = $('#f_d').value || sel, rt = $('#f_rep').value;
  const repeat = rt === 'none' ? {type:'none'} : { type:rt, until: $('#f_until').value || '', days: rt === 'weekly' ? [...fe.days].sort() : [] };
  const remV = $('#f_rem').value;
  const data = { title: titleFromForm(raw), date, time:t1, time2:t2, cat:fe.cat, note:$('#f_n').value.trim(), loc:$('#f_loc').value.trim(), repeat,
    reminder:{ enabled: remV !== 'off', offset: remV === 'off' ? 15 : Number(remV), repeat:'none', days:[] } };
  snap();
  if (src) Object.assign(src, data);
  else S.events.push(Object.assign({ id:uid(), done:false, doneDates:[], skip:[] }, data));
  if (rt === 'none' || !src) { sel = date; syncMini(); if (view === 'month') { monthAnchor = pd(date); monthAnchor.setDate(1); } }
  save(); closeSheet(); render();
  toast(src ? 'Изменения сохранены' : `Создано: ${data.title} · ${relDay(date)}${t1 ? ', ' + t1 : ''}`, true);
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.cat) {
    S.cats.find(c => c.id === t.dataset.cat)[t.dataset.f] = t.value; save(); render();
    if (t.dataset.f === 'color') { const sw = $(`.cswatch[data-id="${t.dataset.cat}"]`); if (sw) sw.style.setProperty('--c', t.value); $$(`.cdot[data-id="${t.dataset.cat}"]`).forEach(d => d.classList.remove('on')); }
  }
  else if (t.id === 'cmd_q') cmdUpdate();
  else if (t.id === 'q_t') {
    const q = window._qc, p = parseNL(t.value, q.base); q.nl = p;
    q.date = p.date || q.base; $('#q_when').textContent = fmtLong(q.date);
    if (p.time) { $('#q_tm').value = p.time; $('#q_tm2').value = p.time2 || fmtMin(Math.min(1439, timeMin(p.time) + 60)); }
    else { $('#q_tm').value = q.t1; $('#q_tm2').value = q.t2; }
    if (p.cat) { q.cat = p.cat; $$('#q_cats .ccat').forEach(b => b.classList.toggle('on', b.dataset.id === p.cat)); }
    nlHint(p, '#q_hint');
  }
  else if (t.id === 'f_t' && !window._fe.nlOff) {
    const p = parseNL(t.value, sel); window._fe.nl = p;
    if (p.date) { $('#f_d').value = p.date; syncRepDays(); }
    if (p.time) { $('#f_all').checked = false; $('#f_tm').disabled = $('#f_tm2').disabled = false; $('#f_tm').value = p.time; $('#f_tm2').value = p.time2 || fmtMin(Math.min(1439, timeMin(p.time) + 60)); }
    if (p.cat) { window._fe.cat = p.cat; $$('#f_cats .ccat').forEach(b => b.classList.toggle('on', b.dataset.id === p.cat)); }
    nlHint(p, '#f_hint');
  }
  else if (t.id === 'ds_new') nlHint(t.value.trim() ? parseNL(t.value, sel) : null, '#ds_hint');
});
document.addEventListener('change', e => {
  const t = e.target, st = S.settings;
  if (t.id === 's_ws') { st.weekStart = Number(t.value); save(); render(); }
  else if (t.id === 's_ds') { st.dayStart = Number(t.value); save(); lastGridView = null; render(); }
  else if (t.id === 's_wk') { st.weekends = t.checked; save(); render(); }
  else if (t.id === 's_wn') { st.weekNums = t.checked; save(); render(); }

  else if (t.id === 'f_all') { $('#f_tm').disabled = $('#f_tm2').disabled = t.checked; if (!t.checked && !$('#f_tm').value) { $('#f_tm').value = '09:00'; $('#f_tm2').value = '10:00'; } }
  else if (t.id === 'f_tm') { const a = timeMin(t.value), b = timeMin($('#f_tm2').value); if (a != null && (b == null || b <= a)) $('#f_tm2').value = fmtMin(Math.min(1439, a + 60)); }
  else if (t.id === 'f_d') syncRepDays();
  else if (t.id === 'f_rep') { syncRepDays(); $('#f_repx').style.display = t.value === 'none' ? 'none' : 'block'; $('#f_days').style.display = t.value === 'weekly' ? 'flex' : 'none'; }
  else if (t.id === 'imp_file') importData(t);
});

// ---- Перетаскивание и растягивание событий ----
const snap15 = m => Math.round(m / 15) * 15;
const pointerMin = (col, y) => startH()*60 + (y - col.getBoundingClientRect().top) / rowH() * 60;
let drag = null, mk = null, lastDragEnd = 0;
document.addEventListener('pointerdown', e => {
  const blk = e.target.closest('.wg-block');
  if (!blk) {
    const col = e.target.closest('.wg-col');
    if (col && e.pointerType === 'mouse' && e.button === 0) { const m = Math.max(startH()*60, Math.floor(pointerMin(col, e.clientY) / 15) * 15); mk = { col, a:m, s:m, e:m + 15, y0:e.clientY, pid:e.pointerId, active:false }; }
    return;
  }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const item = S.events.find(x => x.id === blk.dataset.id); if (!item) return;
  const m = timeMin(item.time), m2 = timeMin(item.time2); if (m == null) return;
  const hadEnd = m2 != null && m2 > m, end = hadEnd ? m2 : m + 60;
  const mode = e.target.closest('.wg-rs') ? 'resize' : 'move';
  drag = { id:item.id, inst:blk.dataset.d, blk, col:blk.parentElement, mode, start:m, end, dur:end - m, hadEnd,
    off: pointerMin(blk.parentElement, e.clientY) - (mode === 'move' ? m : end),
    x0:e.clientX, y0:e.clientY, lastX:e.clientX, lastY:e.clientY, pid:e.pointerId,
    touch: e.pointerType !== 'mouse', active:false, newStart:m, newEnd:end };
  if (drag.touch) drag.timer = setTimeout(startDrag, 320);   // на телефоне — долгое нажатие
});
function startDrag() {
  if (!drag || drag.active) return;
  drag.active = true; drag.blk.classList.add('dragging'); document.body.classList.add('dragmode');
  try { if (drag.touch && navigator.vibrate) navigator.vibrate(10); } catch (x) {}
  requestAnimationFrame(autoScrollDrag);
}
document.addEventListener('pointermove', e => {
  if (mk && e.pointerId === mk.pid) {
    if (!mk.active) { if (Math.abs(e.clientY - mk.y0) < 6) return; mk.active = true; mk.ghost = document.createElement('div'); mk.ghost.className = 'wg-ghost'; mk.col.appendChild(mk.ghost); document.body.classList.add('dragmode'); }
    const cur = pointerMin(mk.col, e.clientY);
    mk.s = Math.max(startH()*60, Math.min(mk.a, Math.floor(cur / 15) * 15)); mk.e = Math.min(1440, Math.max(mk.a + 15, Math.ceil(cur / 15) * 15));
    mk.ghost.style.top = ((mk.s - startH()*60) / 60 * rowH()) + 'px'; mk.ghost.style.height = ((mk.e - mk.s) / 60 * rowH() - 2) + 'px';
    mk.ghost.textContent = fmtMin(mk.s) + '–' + fmtMin(mk.e) + ' · ' + durText(mk.e - mk.s);
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  if (!drag.active) {
    const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
    if (drag.touch) { if (dist > 10) { clearTimeout(drag.timer); drag = null; } return; }
    if (dist < 5) return;
    startDrag();
  }
  updateDrag();
});
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive:false });
function updateDrag() {
  if (drag.mode === 'move') {
    const target = $$('.wg-col').find(c => { const r = c.getBoundingClientRect(); return drag.lastX >= r.left && drag.lastX < r.right; });
    if (target && target !== drag.col) { target.appendChild(drag.blk); drag.col = target; }
    const s0 = Math.max(startH()*60, Math.min(1440 - Math.min(drag.dur, 60), snap15(pointerMin(drag.col, drag.lastY) - drag.off)));
    drag.newStart = s0; drag.newEnd = Math.min(1440, s0 + drag.dur);
  } else {
    drag.newEnd = Math.max(drag.start + 15, Math.min(1440, snap15(pointerMin(drag.col, drag.lastY) - drag.off)));
  }
  drag.blk.style.top = ((drag.newStart - startH()*60) / 60 * rowH()) + 'px';
  drag.blk.style.height = Math.max(20, (drag.newEnd - drag.newStart) / 60 * rowH() - 2) + 'px';
  const m = drag.blk.querySelector('.wb-m');
  if (m) m.textContent = (drag.mode === 'resize' || drag.hadEnd) ? fmtMin(drag.newStart) + '–' + fmtMin(drag.newEnd) : fmtMin(drag.newStart);
}
function autoScrollDrag() {
  if (!drag || !drag.active) return;
  const w = $('.wgwrap');
  if (w) {
    const r = w.getBoundingClientRect(), head = (w.querySelector('.wg-stickytop') || {}).offsetHeight || 0;
    let dy = 0;
    if (drag.lastY < r.top + head + 36) dy = -10; else if (drag.lastY > r.bottom - 36) dy = 10;
    if (dy) { w.scrollTop += dy; updateDrag(); }
  }
  requestAnimationFrame(autoScrollDrag);
}
function endDrag(e, cancelled) {
  if (mk && e.pointerId === mk.pid) {
    const m = mk; mk = null; document.body.classList.remove('dragmode');
    if (!m.active) return;
    lastDragEnd = Date.now();
    if (cancelled) { m.ghost.remove(); return; }
    openQuick(m.col.dataset.d, fmtMin(m.s), e.clientX, e.clientY, fmtMin(m.e));
    m.col.appendChild(m.ghost);
    return;
  }
  if (!drag || e.pointerId !== drag.pid) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  document.body.classList.remove('dragmode');
  if (!d.active) return;                       // это был обычный клик — откроется карточка
  lastDragEnd = Date.now();
  if (!cancelled) {
    const item = S.events.find(x => x.id === d.id), nd = d.col.dataset.d;
    if (item) {
      snap();
      if (isRec(item)) { const delta = dayDiff(d.inst, nd); if (delta) { item.date = addDays(item.date, delta); if (item.repeat.type === 'weekly' && item.repeat.days) item.repeat.days = item.repeat.days.map(x => ((x + delta) % 7 + 7) % 7); } }
      else { item.date = nd; sel = nd; }
      item.time = fmtMin(d.newStart); if (d.mode === 'resize' || d.hadEnd) item.time2 = fmtMin(d.newEnd);
      save();
      toast((d.mode === 'resize' ? 'Длительность: ' + durText(d.newEnd - d.newStart) : 'Перенесено на ' + relDay(isRec(item) ? nd : item.date) + ', ' + item.time) + (isRec(item) ? ' (все повторения)' : ''), true);
    }
  }
  render();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

// ---- Клавиатура ----
document.addEventListener('keydown', e => {
  const t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '') || t.isContentEditable, mod = e.ctrlKey || e.metaKey;
  if (cmdOpen()) {
    if (e.key === 'Escape') { e.preventDefault(); closeCmd(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); cmdIdx = Math.min(cmdItems.length - 1, cmdIdx + 1); cmdDraw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdIdx = Math.max(0, cmdIdx - 1); cmdDraw(); }
    else if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); cmdRun(cmdIdx); }
    return;
  }
  if (mod && e.code === 'KeyK') { e.preventDefault(); openCmd(); return; }
  if (mod && e.code === 'KeyZ' && !typing) { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape') {
    if (drag) { const d = drag; drag = null; clearTimeout(d.timer); document.body.classList.remove('dragmode'); if (d.active) { lastDragEnd = Date.now(); render(); } return; }
    if (mk) { if (mk.ghost) mk.ghost.remove(); mk = null; document.body.classList.remove('dragmode'); return; }
    if (quickOpen()) { e.preventDefault(); closeQuick(); return; }
    if (sheetOpen()) { e.preventDefault(); if (delAsk) { delAsk = null; openSettings(true); return; } closeSheet(); return; }
    return;
  }
  if (e.key === 'Enter' && !e.isComposing) {
    if (t.id === 'q_t') { e.preventDefault(); $('[data-act="qsave"]').click(); return; }
    if (t.id === 'ds_new') {
      const raw = t.value.trim(); if (!raw) return;
      const p = parseNL(raw, sel);
      quickCreate(p.found && p.title ? p.title : raw, p.date || sel, p.time || '', p.time2 || '', p.cat);
      const i = $('#ds_new'); if (i) i.focus();
      return;
    }
    if (mod && $('#f_t') && sheetOpen()) { e.preventDefault(); saveEvent(); return; }
  }
  if (typing || mod || e.altKey || sheetOpen() || quickOpen()) return;
  const k = e.code;
  if (k === 'Slash' && e.shiftKey || e.key === '?') { e.preventDefault(); openHelp(); }
  else if (k === 'Slash') { e.preventDefault(); openCmd(); }
  else if (k === 'KeyT') goToday();
  else if (k === 'KeyM') setView('month');
  else if (k === 'KeyW') setView('week');
  else if (k === 'KeyD') setView('day');
  else if (k === 'KeyL') setView('list');
  else if (k === 'KeyN' || k === 'KeyC') { e.preventDefault(); openEvent(); }
  else if (k === 'ArrowLeft' || k === 'KeyJ') move(-1);
  else if (k === 'ArrowRight' || k === 'KeyK') move(1);
});

// ---- Свайп между периодами ----
let tsx = 0, tsy = 0;
document.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (!e.changedTouches || sheetOpen() || cmdOpen() || quickOpen() || drag || Date.now() - lastDragEnd < 600) return;
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
}, {passive:true});

// ---- Данные: копия и загрузка ----
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `napominalka-${todayK()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Копия сохранена в файл');
}
function importData(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.events) || !Array.isArray(d.cats)) throw new Error('это не копия Напоминалки');
      snap();
      S.events = d.events; S.cats = d.cats.length ? d.cats : S.cats; S.templates = Array.isArray(d.templates) ? d.templates : S.templates;
      if (d.settings) S.settings = Object.assign({}, DEF.settings, d.settings);
      migrate(); save(); closeSheet(); render(); toast(`Загружено событий: ${S.events.length}`, true);
    } catch (x) { toast('Не получилось загрузить: ' + x.message); }
    input.value = '';
  };
  r.readAsText(f);
}

// ---- Уведомления ----
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let notif = { state:'', text:'Проверяю…', short:'проверяю…' };
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('service worker не запустился')), 4000))]);
async function checkNotif() {
  const set = (state, text, short) => { notif = { state, text, short }; };
  if (!('Notification' in window) || !('serviceWorker' in navigator)) set('off', 'Этот браузер не поддерживает уведомления', 'нет поддержки');
  else if (isIOS && navigator.standalone !== true) set('off', 'Откройте приложение с экрана «Домой», а не из Safari', 'откройте с «Домой»');
  else if (Notification.permission === 'denied') set('off', 'Запрещены в настройках телефона или браузера', 'запрещены');
  else if (Notification.permission !== 'granted') set('off', 'Выключены — нажмите «Включить уведомления»', 'выключены');
  else {
    let sub = null; try { const reg = await swReady(); sub = reg.pushManager ? await reg.pushManager.getSubscription() : null; } catch (x) {}
    sub ? set('on', 'Включены, устройство подписано', 'включены') : set('warn', 'Разрешены, но устройство ещё не подписано — нажмите «Включить»', 'не подписано');
  }
  const sl = $('.sb-link .ndot'); if (sl) $('#side').innerHTML = sideHTML();
  const ns = $('#nstat_t'); if (ns) { ns.textContent = notif.text; ns.previousElementSibling.className = 'ndot ' + notif.state; }
}
const plog = t => { const l = $('#plog'); if (l) l.textContent += (l.textContent ? '\n' : '') + t; else toast(t); };
const b64 = v => { const raw = atob((v + '='.repeat((4 - v.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); };
async function enablePush() {
  try {
    if (isIOS && navigator.standalone !== true) return plog('Откройте приложение с экрана «Домой», а не из Safari.');
    if (!('PushManager' in window)) return plog('Уведомления не поддерживаются.');
    const reg = await swReady();
    if (await Notification.requestPermission() !== 'granted') { checkNotif(); return plog('Разрешение на уведомления не выдано.'); }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const r = await fetch(SUPABASE_URL + '/rest/v1/push_subscriptions', { method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth }) });
    plog(r.ok || r.status === 409 ? 'Уведомления включены.' : 'Ошибка сохранения: ' + r.status);
  } catch (e) { plog('Ошибка: ' + e.message); }
  checkNotif();
}
async function testNotif() {
  try {
    if (!('Notification' in window)) return plog('Этот браузер не поддерживает уведомления.');
    if (isIOS && navigator.standalone !== true) return plog('Откройте приложение с экрана «Домой», а не из Safari.');
    if (Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') { checkNotif(); return plog('Разрешение на уведомления не выдано.'); }
    const reg = await swReady();
    await reg.showNotification('Напоминалка', { body:'Тестовое уведомление — всё работает ✓', icon:'icon-192.png', tag:'test' });
    S.settings.lastTest = Date.now(); save();
    toast('Тестовое уведомление отправлено');
    if (sheetOpen() && $('#nstat_t')) openSettings(true);
  } catch (e) { plog('Ошибка: ' + e.message); }
  checkNotif();
}

// ---- Обновление «сейчас» раз в 30 секунд ----
function tick() {
  if (document.hidden) return;
  const ae = document.activeElement, busy = drag || mk || quickOpen() || sheetOpen() || cmdOpen() || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
  if (!busy) render();
}
let lastDay = todayK(), lastWide = innerWidth >= 900, rsT;
// Наступил новый день, а открыт был «сегодня» — переходим на новый день
const rollDay = () => { const t = todayK(); if (t !== lastDay) { if (sel === lastDay) { sel = t; syncMini(); monthAnchor = pd(t); monthAnchor.setDate(1); } lastDay = t; } };
setInterval(() => { rollDay(); tick(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { rollDay(); tick(); checkNotif(); } });
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { const wide = innerWidth >= 900; if (wide !== lastWide) { lastWide = wide; lastGridView = null; } if (!drag && !mk && !quickOpen()) render(); }, 150); });

// Иконки в статичной шапке
$$('[data-act=prev]').forEach(b => b.innerHTML = I(IC.left, 20));
$$('[data-act=next]').forEach(b => b.innerHTML = I(IC.right, 20));
$('[data-act=settings]').innerHTML = I(IC.gear, 19);
$('.bar2 [data-act=search]').innerHTML = I(IC.search, 19);
$('.btn-new').innerHTML = I(IC.plus, 17) + 'Создать';

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
checkNotif();
</script>
