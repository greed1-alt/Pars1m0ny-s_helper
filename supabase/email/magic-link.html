<!-- Письмо с кодом входа (5 ноября 2026, для своего сервера; раньше шаблон «Magic link» жил только в панели Supabase).
     Код вместо ссылки: ссылка на iPhone открылась бы в Safari, а не в приложении с экрана «Домой».
     {{ .Token }} — шестизначный код, подставляет сервер входа (GoTrue). Тема письма — GOTRUE_MAILER_SUBJECTS_MAGIC_LINK. -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Код для входа в Parsimony</title></head>
<body style="margin:0;padding:0;background:#f4f4f6">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f6;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1d1d1c">
        <tr><td style="font-size:15px;letter-spacing:.32em;color:#4f46e5;padding-bottom:22px">PARSIMONY</td></tr>
        <tr><td style="font-size:20px;font-weight:700;padding-bottom:10px">Ваш код для входа</td></tr>
        <tr><td style="font-size:15px;line-height:1.5;color:#5f5e5b;padding-bottom:20px">Введите его в приложении — пароль не нужен.</td></tr>
        <tr><td align="center" style="padding-bottom:22px">
          <div style="display:inline-block;font-size:34px;font-weight:700;letter-spacing:.22em;padding:14px 22px;border-radius:12px;background:#eef0ff;color:#1d1d1c;font-family:'SF Mono',Menlo,Consolas,monospace">{{ .Token }}</div>
        </td></tr>
        <tr><td style="font-size:13px;line-height:1.5;color:#8a8986">Код действует один час. Если вы не входили в Parsimony — просто удалите это письмо: без кода в аккаунт никто не войдёт.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
